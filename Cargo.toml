[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrtolkien/uraeda"
publish = false
rust-version = "1.100"

[workspace.dependencies]
# The pages' HTTP, with only what they serve: HTTP/1 on tokio, and JSON.
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "matched-path",
  "multipart",
  "query",
  "tokio",
  "ws",
] }
clap = { version = "4.6.7", features = ["derive"] }
# Exact: its dynamic completion, `unstable-dynamic`, is exempt from semver.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
getrandom = "0.4"
gif = "0.14.2"
# The lines' diff of a patch, without git: the crate gix compares blobs with, which the lockfile
# holds already.
gix-imara-diff = "0.3.1"
gix = { version = "0.90", default-features = false, features = ["sha1", "revision", "status"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
include_dir = "0.7.4"
libc = "0.2.190"
libwebp-sys = "0.14.4"
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde-saphyr = "1.3.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# HTTP requests, in the tests of the pages.
ureq = "3.5"
# The phone's starter vault, stored without compression.
zip = { version = "9.5", default-features = false }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display", "serde"] }
tempfile = "3"
thiserror = "2.0.21"
# Mermaid diagrams, drawn in Rust as SVG for the pages. Without the ELK and Cytoscape layouts and the math renderer, which no
# diagram of a workflow file needs.
merman = { version = "=0.9.3", default-features = false, features = [
  "all-diagrams",
  "native-fonts",
  "svg",
] }
uraeda-core = { path = "crates/core" }
uraeda-serve = { path = "crates/serve" }
uraeda-text = { path = "crates/text" }
uraeda-vault = { path = "crates/vault" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
too_many_lines = "warn"

# A dev build keeps only what a backtrace needs, a file and a line in the workspace's own code:
# full debug information was 70% of each 1.25 GB test binary, and the linker holds it in memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

# The profile that dist builds releases with.
[profile.dist]
inherits = "release"
