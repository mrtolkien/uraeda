[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.96"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.89", default-features = false, features = ["sha1", "revision", "status"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-build = "2.6.0"
napi-derive = "3.6.12"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
tempfile = "3"
thiserror = "2.0.21"
uraeda-core = { path = "crates/core" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
