[package]
name = "uraeda-app"
description = "Uraeda's app on Native Shell: the native module `uraeda/native`, the native components, and the Linux host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# cargo-nextest does not run doctests, and the crate has none.
[lib]
doctest = false

# The app on Linux: a window on GTK, which finds or starts this machine's server.
[[bin]]
name = "uraeda"
required-features = ["host"]

[features]
default = ["host"]
# The Linux host's native component `uraeda.extension`, which runs an extension's page in a view
# of its own. The server takes the module list of `uraeda/native` alone, without GTK.
# The Linux host, `uraeda`, and its server start and secret store (`host.rs`, `server_start.rs`).
host = ["dep:libc", "dep:nsh-engine", "dep:nsh-platform-linux", "dep:ureq"]

[dependencies]
nsh-base.workspace = true
nsh-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Code blocks' colours, with the syntaxes NSH's editor reads: `highlight.rs`.
syntect.workspace = true
two-face.workspace = true
# The document tree of a reply's finished blocks, read by the core's parser: `reply.rs`.
uraeda-core.workspace = true
# Diagrams, drawn in Rust as a picture of shapes: `diagram.rs`.
base64.workspace = true
merman.workspace = true
merman-export.workspace = true
usvg.workspace = true
# The names of an extension page's host channel.
uraeda-protocol.workspace = true
# The text fields' Vim keys, which `vim_bridge.rs` carries out on Native Shell's editor.
uraeda-vim.workspace = true

# `extension_view.rs`: an extension's page, fetched whole from the server, verified under its key,
# and run in a GTK view of its own.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-engine = { workspace = true, optional = true }
nsh-platform-linux = { workspace = true, features = ["js"], optional = true }
ureq = { workspace = true, optional = true }
# The host stops the server it started with a signal (`server_start.rs`).
libc = { workspace = true, optional = true }

# `tests/native.rs` reads the module's documentation as TypeScript gets it: Native Shell keeps that
# text out of a build without `declarations`.
[dev-dependencies]
nsh-core = { workspace = true, features = ["declarations"] }
# `tests/theme.rs` measures the shipped themes, which the core reads, from a temporary folder.
tempfile.workspace = true

# `tests/outside.rs` checks NSH's behaviours the migration relies on, in GTK windows on the hidden
# display: it builds pages as the server will, and embeds them as the Linux host will.
[target.'cfg(target_os = "linux")'.dev-dependencies]
log = "0.4"
nsh-bundler.workspace = true
nsh-engine.workspace = true
nsh-package.workspace = true
nsh-platform-linux = { workspace = true, features = ["js", "webview"] }
# rolldown's crates that nothing else holds at rolldown's version: see the workspace's manifest.
rolldown_devtools.workspace = true
rolldown_devtools_action.workspace = true
rolldown_fs.workspace = true
rolldown_std_utils.workspace = true
rolldown_tracing.workspace = true

[lints]
workspace = true
