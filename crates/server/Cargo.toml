[package]
name = "uraeda-server"
description = "Uraeda's server, run as `ura serve`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# cargo-nextest does not run doctests, and the crate has none.
[lib]
doctest = false

[dependencies]
nsh-bundler.workspace = true
# rolldown's crates that nothing else holds at rolldown's version: see the workspace's manifest.
rolldown_devtools.workspace = true
rolldown_devtools_action.workspace = true
rolldown_fs.workspace = true
rolldown_std_utils.workspace = true
rolldown_tracing.workspace = true

[lints]
workspace = true
