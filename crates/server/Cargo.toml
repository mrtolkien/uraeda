[package]
name = "uraeda-server"
description = "Uraeda's server, run as `ura serve`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# One program holds every integration test: `tests/main.rs`.
autotests = false

# cargo-nextest does not run doctests, and the crate has none.
[lib]
doctest = false

# What the tests run as commands, built beside them: a fake Storybook as the previews' preview
# command, and a stand-in of `codex` for its runtime. No release holds them.
[[bin]]
name = "fake-storybook"
path = "tests/bin/fake_storybook.rs"
test = false
doc = false

[[bin]]
name = "fake-codex"
path = "tests/bin/fake_codex.rs"
test = false
doc = false

# Every integration test, in one program: each program linked the whole crate and what it depends
# on, about 400 MB each, so a cold build of the workspace's tests passed what a CI runner has free.
[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
include_dir.workspace = true
jiff.workspace = true
libc.workspace = true
# Extension pages: the modules NSH's own sets serve, the bundler, and the signed package.
nsh-base.workspace = true
nsh-bundler.workspace = true
nsh-core.workspace = true
nsh-package.workspace = true
notify.workspace = true
percent-encoding.workspace = true
regex.workspace = true
# rolldown's crates that nothing else holds at rolldown's version: see the workspace's manifest.
rolldown_devtools.workspace = true
rolldown_devtools_action.workspace = true
rolldown_fs.workspace = true
rolldown_std_utils.workspace = true
rolldown_tracing.workspace = true
rquickjs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The previews: a command's output, and a WebSocket piped to it.
tokio = { workspace = true, features = ["io-util", "process"] }
ureq.workspace = true
# The module list of `uraeda/native`, which `uraeda/ui` imports in a page: no GTK, no view.
uraeda-app.workspace = true
uraeda-compile.workspace = true
uraeda-core.workspace = true
uraeda-protocol.workspace = true
url.workspace = true

[dev-dependencies]
futures-util.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
# The paused clock: the live engine's pacing is tested without a wait.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
ts-rs.workspace = true

[lints]
workspace = true
