[package]
name = "uraeda-server"
description = "Uraeda's server, run as `ura serve`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# cargo-nextest does not run doctests, and the crate has none.
[lib]
doctest = false

[dependencies]
axum.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
nsh-bundler.workspace = true
notify.workspace = true
percent-encoding.workspace = true
regex.workspace = true
# rolldown's crates that nothing else holds at rolldown's version: see the workspace's manifest.
rolldown_devtools.workspace = true
rolldown_devtools_action.workspace = true
rolldown_fs.workspace = true
rolldown_std_utils.workspace = true
rolldown_tracing.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The previews: a command's output, and a WebSocket piped to it.
tokio = { workspace = true, features = ["io-util", "process"] }
uraeda-core.workspace = true
uraeda-protocol.workspace = true

[dev-dependencies]
futures-util.workspace = true
tempfile.workspace = true
# The paused clock: the live engine's pacing is tested without a wait.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
ts-rs.workspace = true

[lints]
workspace = true
