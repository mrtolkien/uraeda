# The parity list: every record type, mutation, and route of the Node server, by its old name, with
# the name this server serves it by, or `dropped: ` and why. The Node server is gone: the keys are
# its names, frozen as its code had them when it went, 46 records, 114 mutations, and 29 routes.
# `tests/parity.rs` fails on a new name this server does not serve, and on a line that went.
# Rulings are in `specs/2026-11-10-nsh-migration/rulings.md`.

# fate's views, by type. A record keeps fate's name (R6), and takes the arguments of R52 and R58.
[records]
Agent = "Agent"
AllBranchChanges = "AllBranchChanges"
BranchChanges = "BranchChanges"
BranchDecision = "BranchDecision"
Buffer = "Buffer"
ConflictFile = "ConflictFile"
ContinuedAll = "dropped: what `feature.continueAll` answers, the type `ContinuedAll` of its result, no record (R58)"
Dropped = "dropped: what `feature.drop` answers, the type `Dropped` of its result, no record (R58)"
ExtensionAction = "dropped: what `extensions.act` answers, the type `ExtensionAction` of its result, no record (R221)"
ExtensionRecord = "ExtensionRecord"
Extensions = "Extensions"
Feature = "Feature"
FolderSuggestions = "FolderSuggestions"
GitCommit = "GitCommit"
GitDiff = "GitDiff"
GitHistoryPage = "GitHistoryPage"
GitPage = "GitPage"
GitSummary = "GitSummary"
History = "History"
Inbox = "Inbox"
Jobs = "Jobs"
JobsRun = "dropped: what `jobs.runNow` answers, the type `JobsRan` of its result, no record (R191)"
Ledger = "Ledger"
NeedsYouList = "NeedsYouList"
Preview = "Preview"
Priorities = "Priorities"
ProposalFile = "ProposalFile"
ProposalHints = "ProposalHints"
RecommendedMessage = "RecommendedMessage"
Repositories = "Repositories"
Session = "Session"
SessionList = "SessionList"
SessionSearch = "SessionSearch"
Settings = "Settings"
SlugProposal = "SlugProposal"
StartPlan = "dropped: what a feature's start answers, the type `StartPlan` of its result, no record (R58, R91)"
Story = "Story"
StoryHref = "StoryHref"
Themes = "Themes"
Turn = "Turn"
TurnLog = "TurnLog"
Undo = "dropped: what `undo.apply` and `undo.committed` answer, the types `UndoApplied` and `UndoCommitted`, no record (R63)"
WorkflowFile = "WorkflowFile"
WorkflowMessage = "WorkflowMessage"
Workspace = "Workspace"
WriteQueue = "WriteQueue"

