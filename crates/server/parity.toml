# Hono's routes, as `<METHOD> <path>`, mapped to the path of axum's syntax that serves them, for
# every method the old route took.
[routes]
"ALL /mcp" = "/mcp"
"ALL /r/:name/preview/*" = "/r/{name}/preview/{secret}/{folder}/{*rest}"
"ALL /r/:name/x/:extension/*" = "/r/{name}/x/{extension}/{*path}"
"ALL /x/:extension/*" = "/x/{extension}/{*path}"
"DELETE /r/:name/chat-images/:id" = "/r/{name}/chat-images/{id}"
"DELETE /session" = "/session"
"DELETE /sessions" = "/sessions"
"GET /*" = "dropped: the React UI's built files; the app is native, and its web build is served by task 56 (R121)"
"GET /extensions/:name/page" = "/extensions/{name}/page"
"GET /fate/live" = "/live"
"GET /mockups/*" = "dropped: a link from before repositories had names (R77)"
"GET /r/:name/chat-images/:id" = "/r/{name}/chat-images/{id}"
"GET /r/:name/fate/live" = "/live"
"GET /r/:name/images/*" = "/r/{name}/images/{*path}"
"GET /r/:name/mockups/*" = "/r/{name}/mockups/{*path}"
"GET /r/:name/raw/*" = "/r/{name}/raw/{*path}"
"GET /raw/*" = "dropped: a link from before repositories had names (R77)"
"GET /session" = "/session"
"GET /session/:token" = "/session/{token}"
"POST /fate" = "/live"
"POST /fate/live" = "/live"
"POST /mcp" = "/mcp"
"POST /open" = "/open"
"POST /r/:name/attach" = "/r/{name}/attach"
"POST /r/:name/fate" = "/live"
"POST /r/:name/fate/live" = "/live"
"POST /r/:name/inbox/note-image" = "/r/{name}/inbox/note-image"
