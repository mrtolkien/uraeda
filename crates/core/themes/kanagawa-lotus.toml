#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Kanagawa Lotus, from kanagawa.nvim at commit bb85e4b, MIT: the entries of its colors.lua that its
# themes.lua draws Lotus with, under colors.lua's names.
# https://github.com/rebelot/kanagawa.nvim/blob/bb85e4bfc8d89b0e62c8fa53ccdd13d12e2f77b3/lua/kanagawa/colors.lua
# https://github.com/rebelot/kanagawa.nvim/blob/bb85e4bfc8d89b0e62c8fa53ccdd13d12e2f77b3/lua/kanagawa/themes.lua
name = "Kanagawa Lotus"
mode = "light"

[palette]
lotusInk1 = "#545464"
lotusInk2 = "#43436c"
lotusGray = "#dcd7ba"
lotusGray2 = "#716e61"
lotusGray3 = "#8a8980"
lotusWhite0 = "#d5cea3"
lotusWhite1 = "#dcd5ac"
lotusWhite2 = "#e5ddb0"
lotusWhite3 = "#f2ecbc"
lotusWhite4 = "#e7dba0"
lotusWhite5 = "#e4d794"
lotusViolet1 = "#a09cac"
lotusViolet2 = "#766b90"
lotusViolet3 = "#c9cbd1"
lotusViolet4 = "#624c83"
lotusBlue1 = "#c7d7e0"
lotusBlue2 = "#b5cbd2"
lotusBlue3 = "#9fb5c9"
lotusBlue4 = "#4d699b"
lotusBlue5 = "#5d57a3"
lotusGreen = "#6f894e"
lotusGreen2 = "#6e915f"
lotusGreen3 = "#b7d0ae"
lotusPink = "#b35b79"
lotusOrange = "#cc6d00"
lotusOrange2 = "#e98a00"
lotusYellow = "#77713f"
lotusYellow2 = "#836f4a"
lotusYellow3 = "#de9800"
lotusYellow4 = "#f9d791"
lotusRed = "#c84053"
lotusRed2 = "#d7474b"
lotusRed3 = "#e82424"
lotusRed4 = "#d9a594"
lotusAqua = "#597b75"
lotusAqua2 = "#5e857a"
lotusTeal1 = "#4e8ca2"
lotusTeal2 = "#6693bf"
lotusTeal3 = "#5a7785"
lotusCyan = "#d7e3d8"
sumiInk3 = "#1f1f28"
# Not Kanagawa's: its colours darkened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (R4).
lotusTeal2-floor = "#355a7e"
lotusTeal1-floor = "#335c6b"
lotusGray3-floor = "#585751"
lotusAqua-floor = "#425c57"
lotusBlue4-floor = "#3f557e"
lotusPink-floor = "#883f58"
lotusYellow2-floor = "#625337"
lotusRed2-floor = "#a32427"
lotusViolet2-floor = "#5b536f"
lotusOrange2-floor = "#7a4800"
lotusOrange-floor = "#854700"
lotusGreen2-floor = "#465c3d"
lotusGreen-floor = "#4a5b34"
lotusYellow-floor = "#5a5530"
lotusAqua2-floor = "#415d55"
lotusBlue5-floor = "#534e92"
lotusTeal3-floor = "#445a64"
lotusViolet1-floor = "#585464"

[roles]
page = "lotusWhite3"
raised = "#fcfaee"
sunken = "lotusWhite0"
chip = "lotusWhite4"
cursor-row = "lotusViolet3"
marked = "lotusOrange2-floor"
rule = "lotusGray2"
pane-title = "lotusViolet2-floor"
ink = "lotusInk1"
# Lotus's fg_dim, lotusInk2, is darker than its fg, lotusInk1, so it would read over the text: quiet
# and faint text take its nontext, lotusViolet1, whose floor step reads under lotusInk1.
ink-quiet = "lotusViolet1-floor"
ink-faint = "lotusViolet1-floor"
action = "lotusBlue4-floor"
on-action = "lotusWhite3"
needs-you = "lotusOrange-floor"
changed = "lotusViolet4"
added = "lotusGreen2-floor"
removed = "lotusRed2-floor"
caution = "lotusOrange2-floor"
context = "lotusTeal3-floor"
yours = "lotusBlue4-floor"
link = "lotusTeal2-floor"
working = "lotusBlue4-floor"
live = "lotusAqua2-floor"
example = "lotusAqua-floor"
sub-agent = "lotusAqua-floor"
heading-1 = "lotusBlue4-floor"
heading-2 = "lotusViolet4"
heading-3 = "lotusGreen-floor"
code-inline = "lotusOrange-floor"
quote = "lotusBlue5-floor"
mode-normal = "lotusBlue4-floor"
mode-insert = "lotusGreen-floor"
mode-visual = "lotusViolet4"
mode-replace = "lotusOrange-floor"
mode-command = "lotusYellow2-floor"
code-ground = "lotusWhite0"
syntax-keyword = "lotusViolet4"
syntax-string = "lotusGreen-floor"
syntax-comment = "lotusGray3-floor"
syntax-number = "lotusPink-floor"
syntax-constant = "lotusOrange-floor"
syntax-function = "lotusBlue4-floor"
syntax-type = "lotusAqua-floor"
syntax-operator = "lotusYellow2-floor"
syntax-property = "lotusYellow-floor"
syntax-punctuation = "lotusTeal1-floor"
syntax-tag = "lotusTeal2-floor"
syntax-attribute = "lotusYellow-floor"
syntax-variable = "lotusInk1"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#dfdab1"
well = "#e9e3b7"
rule-quiet = "#b9b594"
glass-tint = "#fcfaee"
backdrop-wash-1 = "lotusBlue4-floor"
backdrop-wash-2 = "lotusTeal3-floor"
light-focus = "lotusBlue4-floor"
light-focus-2 = "lotusTeal3-floor"
light-running = "lotusAqua-floor"
