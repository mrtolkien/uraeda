#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Catppuccin Macchiato, from Catppuccin's palette.json v1.8.0, MIT:
# https://github.com/catppuccin/palette/blob/v1.8.0/palette.json
# Mocha's roles, drawn in this flavour's palette.
name = "Catppuccin Macchiato"
extends = "catppuccin-mocha"

[palette]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
# Not Catppuccin's: mauve at 14% over base.
mauve-tint = "#3b3854"
# Not Catppuccin's: each published colour lightened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
overlay2-floor = "#a0a6c0"
