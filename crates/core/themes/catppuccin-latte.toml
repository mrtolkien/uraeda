#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Catppuccin Latte, from Catppuccin's palette.json v1.8.0, MIT:
# https://github.com/catppuccin/palette/blob/v1.8.0/palette.json
name = "Catppuccin Latte"
mode = "light"

[palette]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"
# Not Catppuccin's: its accents darkened, a whole percent of HSL lightness at a time, to the first
# step at which every pair they are in reaches the contrast floor (4.5:1 as text on the page).
mauve-floor = "#7d26ed"
red-floor = "#be0e34"
peach-floor = "#a83e01"
yellow-floor = "#875612"
green-floor = "#2d711e"
teal-floor = "#116a6f"
sky-floor = "#036991"
sapphire-floor = "#177282"
blue-floor = "#0a54e5"
lavender-floor = "#3654fc"
# Not Catppuccin's: overlay2 darkened the same way, to 4.5:1 on a selected row.
overlay2-floor = "#5e6173"
# Not Catppuccin's: mauve-floor at 10% over base.
mauve-tint = "#e4ddf4"
# Not Catppuccin's: text on a filled action or status.
white = "#ffffff"
# Not Catppuccin's: the raised height's fill, one step above base.
base-raised = "#fbfbfd"
# Not Catppuccin's: the light and the shade under a height's top edge.
white-lip = "#fffffff2"
ink-shade = "#282a3c29"

[roles]
page = "base"
raised = "base-raised"
sunken = "mantle"
chip = "crust"
cursor-row = "mauve-tint"
marked = "yellow-floor"
rule = "overlay2"
pane-title = "lavender-floor"
ink = "text"
ink-quiet = "subtext1"
ink-faint = "overlay2-floor"
action = "mauve-floor"
on-action = "white"
needs-you = "peach-floor"
changed = "mauve-floor"
added = "green-floor"
removed = "red-floor"
caution = "yellow-floor"
context = "blue-floor"
yours = "blue-floor"
link = "blue-floor"
working = "blue-floor"
live = "sapphire-floor"
example = "teal-floor"
sub-agent = "teal"
heading-1 = "mauve-floor"
heading-2 = "blue-floor"
heading-3 = "green-floor"
code-inline = "peach-floor"
quote = "subtext1"
mode-normal = "mauve-floor"
mode-insert = "green-floor"
mode-visual = "blue-floor"
mode-replace = "red-floor"
mode-command = "peach-floor"
code-ground = "mantle"
syntax-keyword = "mauve-floor"
syntax-string = "green-floor"
syntax-comment = "overlay2-floor"
syntax-number = "peach-floor"
syntax-constant = "peach-floor"
syntax-function = "blue-floor"
syntax-type = "yellow-floor"
syntax-operator = "sky-floor"
syntax-property = "lavender-floor"
syntax-punctuation = "overlay2-floor"
syntax-tag = "red-floor"
syntax-attribute = "yellow-floor"
syntax-variable = "text"
backdrop = "crust"
backdrop-wash-1 = "mauve-floor"
backdrop-wash-2 = "blue-floor"
well = "mantle"
rule-quiet = "surface1"
lip = "white-lip"
shade = "ink-shade"
glass-tint = "base-raised"
glass-rim = "white"
light-focus = "mauve-floor"
light-focus-2 = "blue-floor"
light-running = "teal-floor"
