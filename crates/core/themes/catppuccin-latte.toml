#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Catppuccin Latte, from Catppuccin's palette.json v1.8.0, MIT:
# https://github.com/catppuccin/palette/blob/v1.8.0/palette.json
name = "Catppuccin Latte"
mode = "light"

[palette]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"
# Not Catppuccin's: its accents darkened to 4.5:1 as text on the page.
mauve-floor = "#7b2fe0"
red-floor = "#bc0d33"
peach-floor = "#a63f00"
yellow-floor = "#875800"
green-floor = "#2c6f1f"
teal-floor = "#0f6c72"
sky-floor = "#0a688e"
sapphire-floor = "#04699a"
blue-floor = "#1957d5"
lavender-floor = "#4254c8"
# Not Catppuccin's: overlay2 darkened to 4.5:1 on a selected row.
overlay2-floor = "#5f6276"
# Not Catppuccin's: mauve-floor at 10% over base.
mauve-tint = "#e3def3"
# Not Catppuccin's: text on a filled action or status.
white = "#ffffff"

[roles]
page = "base"
raised = "mantle"
sunken = "mantle"
chip = "crust"
cursor-row = "mauve-tint"
marked = "yellow-floor"
rule = "overlay2"
pane-title = "lavender-floor"
ink = "text"
ink-quiet = "subtext1"
ink-faint = "overlay2-floor"
action = "mauve-floor"
on-action = "white"
needs-you = "peach-floor"
changed = "mauve-floor"
added = "green-floor"
removed = "red-floor"
caution = "yellow-floor"
context = "blue-floor"
yours = "blue-floor"
link = "blue-floor"
working = "blue-floor"
live = "sapphire-floor"
example = "teal-floor"
sub-agent = "teal"
heading-1 = "mauve-floor"
heading-2 = "blue-floor"
heading-3 = "green-floor"
code-inline = "peach-floor"
quote = "subtext1"
mode-normal = "blue-floor"
mode-insert = "green-floor"
mode-visual = "mauve-floor"
mode-replace = "red-floor"
mode-command = "peach-floor"
code-ground = "mantle"
syntax-keyword = "mauve-floor"
syntax-string = "green-floor"
syntax-comment = "overlay2-floor"
syntax-number = "peach-floor"
syntax-constant = "peach-floor"
syntax-function = "blue-floor"
syntax-type = "yellow-floor"
syntax-operator = "sky-floor"
syntax-property = "lavender-floor"
syntax-punctuation = "overlay2-floor"
syntax-tag = "red-floor"
syntax-attribute = "yellow-floor"
syntax-variable = "text"
