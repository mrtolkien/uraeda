link = "springBlue"
working = "crystalBlue"
live = "waveAqua1"
example = "waveAqua2"
sub-agent = "waveAqua2"
heading-1 = "crystalBlue"
heading-2 = "oniViolet-floor"
heading-3 = "springGreen"
code-inline = "surimiOrange"
quote = "oniViolet2"
