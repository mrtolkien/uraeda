#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Solarized Light, from Ethan Schoonover's Solarized at 62f656a, MIT:
# https://github.com/altercation/solarized/blob/62f656a02f93c5190a8753159e34b385588d5ff3/README.md
# Roles follow its own Vim colour scheme, light background.
name = "Solarized Light"
mode = "light"

[palette]
base03 = "#002b36"
base02 = "#073642"
base01 = "#586e75"
base00 = "#657b83"
base0 = "#839496"
base1 = "#93a1a1"
base2 = "#eee8d5"
base3 = "#fdf6e3"
yellow = "#b58900"
orange = "#cb4b16"
red = "#dc322f"
magenta = "#d33682"
violet = "#6c71c4"
blue = "#268bd2"
cyan = "#2aa198"
green = "#859900"
# Not Solarized's: its colours darkened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
base00-floor = "#4b5c62"
base0-floor = "#75888a"
base1-floor = "#586565"
yellow-floor = "#806100"
orange-floor = "#af4113"
red-floor = "#c02320"
magenta-floor = "#bc2970"
violet-floor = "#545aba"
blue-floor = "#1d6aa0"
cyan-floor = "#1e716b"
green-floor = "#5d6b00"
# Not Solarized's: Uraeda's own mix for the row under the cursor, which Solarized draws in base2,
# the tone of raised panes and chips here: blue, its accent, at 10% over base3, as Catppuccin
# Latte's cursor row is its accent at 10% over its page.
blue-tint = "#e8ebe1"

[roles]
page = "base3"
raised = "#fffdf8"
sunken = "base3"
chip = "base2"
cursor-row = "blue-tint"
# Solarized has one tone for secondary content, base1, which quiet and faint text share; base1's
# floor step for text is too dark for a rule, which takes base0's own step.
rule = "base0-floor"
ink = "base00-floor"
ink-quiet = "base1-floor"
ink-faint = "base1-floor"
on-action = "base3"
quote = "base1-floor"
code-ground = "base2"
syntax-comment = "base1-floor"
syntax-punctuation = "base1-floor"
syntax-variable = "base00-floor"
marked = "yellow-floor"
pane-title = "violet-floor"
action = "blue-floor"
needs-you = "orange-floor"
changed = "violet-floor"
added = "green-floor"
removed = "red-floor"
caution = "yellow-floor"
context = "blue-floor"
yours = "blue-floor"
link = "blue-floor"
working = "blue-floor"
live = "cyan-floor"
example = "cyan-floor"
sub-agent = "cyan-floor"
heading-1 = "orange-floor"
heading-2 = "blue-floor"
heading-3 = "green-floor"
code-inline = "cyan-floor"
mode-normal = "blue-floor"
mode-insert = "green-floor"
mode-visual = "magenta-floor"
mode-replace = "red-floor"
mode-command = "orange-floor"
syntax-keyword = "green-floor"
syntax-string = "cyan-floor"
syntax-number = "cyan-floor"
syntax-constant = "cyan-floor"
syntax-function = "blue-floor"
syntax-type = "yellow-floor"
syntax-operator = "green-floor"
syntax-property = "blue-floor"
syntax-tag = "blue-floor"
syntax-attribute = "yellow-floor"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#e8e4d4"
well = "#f5efdd"
rule-quiet = "#c1c6bc"
glass-tint = "#fffdf8"
backdrop-wash-1 = "blue-floor"
backdrop-wash-2 = "violet-floor"
light-focus = "blue-floor"
light-focus-2 = "violet-floor"
light-running = "cyan-floor"
