#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Catppuccin Frappé, from Catppuccin's palette.json v1.8.0, MIT:
# https://github.com/catppuccin/palette/blob/v1.8.0/palette.json
# Mocha's roles, drawn in this flavour's palette.
name = "Catppuccin Frappé"
extends = "catppuccin-mocha"

[palette]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"
# Not Catppuccin's: mauve at 14% over base.
mauve-tint = "#46435c"
# Not Catppuccin's: each published colour lightened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
mauve-floor = "#cea6e8"
red-floor = "#eda1a2"
peach-floor = "#f0a27b"
blue-floor = "#99b3f0"
subtext0-floor = "#acb4d2"
overlay2-floor = "#aeb4cb"
overlay0-floor = "#777d97"

[roles]
rule = "overlay0-floor"
ink-quiet = "subtext0-floor"
action = "mauve-floor"
needs-you = "peach-floor"
changed = "mauve-floor"
removed = "red-floor"
context = "blue-floor"
yours = "blue-floor"
link = "blue-floor"
working = "blue-floor"
heading-1 = "mauve-floor"
heading-2 = "blue-floor"
code-inline = "peach-floor"
quote = "subtext0-floor"
mode-normal = "blue-floor"
mode-visual = "mauve-floor"
mode-replace = "red-floor"
mode-command = "peach-floor"
syntax-keyword = "mauve-floor"
syntax-number = "peach-floor"
syntax-constant = "peach-floor"
syntax-function = "blue-floor"
syntax-tag = "red-floor"
