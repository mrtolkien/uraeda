#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Tokyo Night Moon, from folke's tokyonight.nvim v4.14.1, its Moon style, Apache 2.0:
# https://github.com/folke/tokyonight.nvim/blob/v4.14.1/lua/tokyonight/colors/moon.lua
# Its roles are Tokyo Night's, on Moon's palette.
name = "Tokyo Night Moon"
mode = "dark"
extends = "tokyo-night"

[palette]
bg = "#222436"
bg_dark = "#1e2030"
bg_dark1 = "#191b29"
bg_highlight = "#2f334d"
blue = "#82aaff"
blue0 = "#3e68d7"
blue1 = "#65bcff"
blue2 = "#0db9d7"
blue5 = "#89ddff"
blue6 = "#b4f9f8"
blue7 = "#394b70"
comment = "#636da6"
cyan = "#86e1fc"
dark3 = "#545c7e"
dark5 = "#737aa2"
fg = "#c8d3f5"
fg_dark = "#828bb8"
fg_gutter = "#3b4261"
green = "#c3e88d"
green1 = "#4fd6be"
green2 = "#41a6b5"
magenta = "#c099ff"
magenta2 = "#ff007c"
orange = "#ff966c"
purple = "#fca7ea"
red = "#ff757f"
red1 = "#c53b53"
teal = "#4fd6be"
terminal_black = "#444a73"
yellow = "#ffc777"
# tokyonight.nvim's own bg_visual, which colors/init.lua computes: blue0 at 40% over bg.
bg_visual = "#2d3f76"
# Not Tokyo Night's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
blue-floor = "#8aafff"
comment-floor = "#a7adcd"
dark3-floor = "#646d96"
fg_dark-floor = "#a7aecd"

[roles]
# Moon's fg_dark and blue are under the floor, where Night's are not.
ink-quiet = "fg_dark-floor"
quote = "fg_dark-floor"
action = "blue-floor"
syntax-function = "blue-floor"
context = "blue-floor"
code-inline = "blue-floor"
yours = "blue-floor"
heading-1 = "blue-floor"
mode-normal = "blue-floor"
link = "blue-floor"
working = "blue-floor"
# The design language's heights, glass, and light: not published, mixed from the colours above.
raised = "#2e3043"
rule = "#7079a1"
backdrop = "#13151f"
well = "#1a1c2a"
rule-quiet = "#3e435d"
glass-tint = "#1a1c2a"
backdrop-wash-1 = "blue-floor"
backdrop-wash-2 = "magenta"
light-focus = "blue-floor"
light-focus-2 = "magenta"
light-running = "teal"
