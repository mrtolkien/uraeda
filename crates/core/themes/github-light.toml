#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# GitHub Light, from @primer/primitives v11.10.0's functional tokens (light.css), MIT:
# https://unpkg.com/@primer/primitives@11.10.0/dist/css/functional/themes/light.css
name = "GitHub Light"
mode = "light"

[palette]
bgColor-default = "#ffffff"
bgColor-muted = "#f6f8fa"
bgColor-inset = "#f6f8fa"
bgColor-neutral-muted = "#818b981f"
bgColor-accent-muted = "#ddf4ff"
borderColor-emphasis = "#818b98"
fgColor-default = "#1f2328"
fgColor-muted = "#59636e"
fgColor-disabled = "#818b98"
fgColor-accent = "#0969da"
fgColor-success = "#1a7f37"
fgColor-danger = "#d1242f"
fgColor-attention = "#9a6700"
fgColor-severe = "#bc4c00"
fgColor-done = "#8250df"
fgColor-onEmphasis = "#ffffff"
display-cyan-fgColor = "#006a80"
display-teal-fgColor = "#106e75"
prettylights-syntax-comment = "#59636e"
prettylights-syntax-constant = "#0550ae"
prettylights-syntax-entity = "#6639ba"
prettylights-syntax-entityTag = "#0550ae"
prettylights-syntax-keyword = "#cf222e"
prettylights-syntax-string = "#0a3069"
prettylights-syntax-variable = "#953800"
# Not GitHub's: bgColor-neutral-muted laid over bgColor-default, by its alpha.
neutral-muted-tint = "#f0f1f2"
# Not GitHub's: each published colour darkened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
fgColor-disabled-floor = "#616976"
fgColor-accent-floor = "#0965d3"
fgColor-success-floor = "#187733"
fgColor-danger-floor = "#cc232e"
fgColor-attention-floor = "#8f6000"
fgColor-severe-floor = "#b34800"
fgColor-done-floor = "#7e4ade"
prettylights-syntax-keyword-floor = "#ca212d"

[roles]
page = "bgColor-default"
raised = "#ffffff"
sunken = "bgColor-inset"
chip = "neutral-muted-tint"
cursor-row = "bgColor-accent-muted"
marked = "fgColor-attention-floor"
rule = "borderColor-emphasis"
pane-title = "fgColor-default"
ink = "fgColor-default"
ink-quiet = "fgColor-muted"
ink-faint = "fgColor-disabled-floor"
action = "fgColor-accent-floor"
on-action = "fgColor-onEmphasis"
needs-you = "fgColor-severe-floor"
changed = "fgColor-done-floor"
added = "fgColor-success-floor"
removed = "fgColor-danger-floor"
caution = "fgColor-attention-floor"
context = "fgColor-accent-floor"
yours = "fgColor-accent-floor"
link = "fgColor-accent-floor"
working = "fgColor-accent-floor"
live = "display-cyan-fgColor"
example = "display-teal-fgColor"
sub-agent = "display-teal-fgColor"
heading-1 = "fgColor-default"
heading-2 = "fgColor-default"
heading-3 = "fgColor-default"
code-inline = "fgColor-default"
quote = "fgColor-muted"
mode-normal = "fgColor-accent-floor"
mode-insert = "fgColor-success-floor"
mode-visual = "fgColor-done-floor"
mode-replace = "fgColor-danger-floor"
mode-command = "fgColor-severe-floor"
code-ground = "bgColor-muted"
syntax-keyword = "prettylights-syntax-keyword-floor"
syntax-string = "prettylights-syntax-string"
syntax-comment = "prettylights-syntax-comment"
syntax-number = "prettylights-syntax-constant"
syntax-constant = "prettylights-syntax-constant"
syntax-function = "prettylights-syntax-entity"
syntax-type = "prettylights-syntax-variable"
syntax-operator = "prettylights-syntax-keyword-floor"
syntax-property = "prettylights-syntax-constant"
syntax-punctuation = "fgColor-default"
syntax-tag = "prettylights-syntax-entityTag"
syntax-attribute = "prettylights-syntax-entity"
syntax-variable = "fgColor-default"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#e4e5e5"
well = "#f8f9f9"
rule-quiet = "#c8ccd2"
glass-tint = "#ffffff"
backdrop-wash-1 = "fgColor-accent-floor"
backdrop-wash-2 = "fgColor-done-floor"
light-focus = "fgColor-accent-floor"
light-focus-2 = "fgColor-done-floor"
light-running = "display-teal-fgColor"
