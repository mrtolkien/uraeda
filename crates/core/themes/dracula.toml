#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Dracula, from Dracula's specification (Dracula Classic, its palette and UI palette), as published
# on 2026-11-07, MIT: https://draculatheme.com/spec
name = "Dracula"
mode = "dark"

[palette]
background = "#282a36"
current-line = "#6272a4"
selection = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
red = "#ff5555"
orange = "#ffb86c"
yellow = "#f1fa8c"
green = "#50fa7b"
cyan = "#8be9fd"
purple = "#bd93f9"
pink = "#ff79c6"
floating = "#343746"
background-lighter = "#424450"
background-light = "#343746"
background-dark = "#21222c"
background-darker = "#191a21"
# The spec's opaque line highlight, for an editor without alpha.
current-line-opaque = "#353747"
# Not Dracula's: each published colour lightened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
comment-floor = "#a5aecb"
red-floor = "#ff7575"

[roles]
page = "background"
raised = "#343641"
sunken = "background-darker"
chip = "background-light"
cursor-row = "current-line-opaque"
marked = "yellow"
rule = "#717fac"
pane-title = "purple"
ink = "foreground"
# Dracula's specification publishes no colour for secondary text: what reads second takes its
# comment colour, at its floor step, as faint text does.
ink-quiet = "comment-floor"
ink-faint = "comment-floor"
action = "purple"
on-action = "background-darker"
needs-you = "orange"
changed = "pink"
added = "green"
removed = "red-floor"
caution = "yellow"
context = "cyan"
yours = "purple"
link = "cyan"
working = "cyan"
live = "pink"
example = "green"
sub-agent = "cyan"
heading-1 = "purple"
heading-2 = "purple"
heading-3 = "purple"
code-inline = "green"
quote = "yellow"
mode-normal = "purple"
mode-insert = "green"
mode-visual = "yellow"
mode-replace = "red-floor"
mode-command = "orange"
code-ground = "background-dark"
syntax-keyword = "pink"
syntax-string = "yellow"
syntax-comment = "comment-floor"
syntax-number = "orange"
syntax-constant = "orange"
syntax-function = "green"
syntax-type = "cyan"
syntax-operator = "pink"
syntax-property = "foreground"
syntax-punctuation = "foreground"
syntax-tag = "pink"
syntax-attribute = "green"
syntax-variable = "foreground"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#17181f"
well = "#1f202a"
rule-quiet = "#424960"
glass-tint = "#1f202a"
backdrop-wash-1 = "purple"
backdrop-wash-2 = "cyan"
light-focus = "purple"
light-focus-2 = "cyan"
light-running = "green"
