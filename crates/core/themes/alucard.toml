#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Alucard, Dracula's light variant, from Dracula's specification (Alucard Classic, its palette and
# UI palette), as published on 2026-11-07, MIT: https://draculatheme.com/spec
# Dracula's roles, which it cannot extend, a theme of the other mode.
name = "Alucard"
mode = "light"

[palette]
background = "#fffbeb"
current-line = "#6c664b"
selection = "#cfcfde"
foreground = "#1f1f1f"
comment = "#6c664b"
red = "#cb3a2a"
orange = "#a34d14"
yellow = "#846e15"
green = "#14710a"
cyan = "#036a96"
purple = "#644ac9"
pink = "#a3144d"
floating = "#efeddc"
background-lighter = "#ece9df"
background-light = "#dedccf"
background-dark = "#ceccc0"
background-darker = "#bcbab3"
# Not Dracula's: foreground at 75% over background, the text that reads second, which Dracula's
# palette has no colour for.
foreground-quiet = "#575652"
# The spec's opaque line highlight, for an editor without alpha.
current-line-opaque = "#e2deca"
# Not Dracula's: each published colour darkened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
comment-floor = "#666147"
red-floor = "#b13325"
orange-floor = "#9a4913"
yellow-floor = "#7b6714"
green-floor = "#14700a"
cyan-floor = "#036691"

[roles]
page = "background"
raised = "floating"
sunken = "background-lighter"
chip = "background-light"
cursor-row = "current-line-opaque"
marked = "yellow-floor"
rule = "current-line"
pane-title = "purple"
ink = "foreground"
ink-quiet = "foreground-quiet"
ink-faint = "comment-floor"
action = "purple"
on-action = "background"
needs-you = "orange-floor"
changed = "pink"
added = "green-floor"
removed = "red-floor"
caution = "yellow-floor"
context = "cyan-floor"
yours = "purple"
link = "cyan-floor"
working = "cyan-floor"
live = "pink"
example = "green-floor"
sub-agent = "cyan-floor"
heading-1 = "purple"
heading-2 = "purple"
heading-3 = "purple"
code-inline = "green-floor"
quote = "yellow-floor"
mode-normal = "purple"
mode-insert = "green-floor"
mode-visual = "yellow-floor"
mode-replace = "red-floor"
mode-command = "orange-floor"
code-ground = "floating"
syntax-keyword = "pink"
syntax-string = "yellow-floor"
syntax-comment = "comment-floor"
syntax-number = "orange-floor"
syntax-constant = "orange-floor"
syntax-function = "green-floor"
syntax-type = "cyan-floor"
syntax-operator = "pink"
syntax-property = "foreground"
syntax-punctuation = "foreground"
syntax-tag = "pink"
syntax-attribute = "green-floor"
syntax-variable = "foreground"
