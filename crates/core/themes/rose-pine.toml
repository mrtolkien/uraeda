#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Rosé Pine, from Rosé Pine's palette v4.0.1, its palette.json and source/index.ts at 92af52b, MIT:
# https://github.com/rose-pine/palette/blob/92af52b465ab6e47437aca223c9b8d3009a2023b/source/index.ts
# Roles follow the Neovim port, rose-pine/neovim.
name = "Rosé Pine"
mode = "dark"

[palette]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlightLow = "#21202e"
highlightMed = "#403d52"
highlightHigh = "#524f67"
# Not Rosé Pine's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
muted-floor = "#8e8aa3"
subtle-floor = "#9692af"
pine-floor = "#4097ba"

[roles]
page = "base"
raised = "surface"
sunken = "surface"
chip = "overlay"
cursor-row = "overlay"
marked = "gold"
rule = "muted"
pane-title = "foam"
ink = "text"
ink-quiet = "subtle-floor"
ink-faint = "muted-floor"
action = "iris"
on-action = "base"
needs-you = "rose"
changed = "rose"
added = "foam"
removed = "love"
caution = "gold"
context = "foam"
yours = "iris"
link = "iris"
working = "foam"
live = "pine-floor"
example = "pine-floor"
sub-agent = "pine-floor"
heading-1 = "iris"
heading-2 = "foam"
heading-3 = "rose"
code-inline = "gold"
quote = "subtle-floor"
mode-normal = "rose"
mode-insert = "foam"
mode-visual = "iris"
mode-replace = "pine-floor"
mode-command = "love"
code-ground = "surface"
syntax-keyword = "pine-floor"
syntax-string = "gold"
syntax-comment = "subtle-floor"
syntax-number = "gold"
syntax-constant = "gold"
syntax-function = "rose"
syntax-type = "foam"
syntax-operator = "subtle-floor"
syntax-property = "foam"
syntax-punctuation = "subtle-floor"
syntax-tag = "foam"
syntax-attribute = "iris"
syntax-variable = "text"
