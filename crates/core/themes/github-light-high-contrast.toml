#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# GitHub Light High Contrast, from @primer/primitives v11.10.0's functional tokens
# (light-high-contrast.css), MIT:
# https://unpkg.com/@primer/primitives@11.10.0/dist/css/functional/themes/light-high-contrast.css
# GitHub Light's roles, drawn in this theme's tokens.
name = "GitHub Light High Contrast"
extends = "github-light"

[palette]
bgColor-default = "#ffffff"
bgColor-muted = "#e6eaef"
bgColor-inset = "#eff2f5"
bgColor-neutral-muted = "#e0e6eb"
bgColor-accent-muted = "#dff7ff"
borderColor-emphasis = "#454c54"
fgColor-default = "#010409"
fgColor-muted = "#454c54"
fgColor-disabled = "#59636e"
fgColor-accent = "#023b95"
fgColor-success = "#04591f"
fgColor-danger = "#960d1e"
fgColor-attention = "#603700"
fgColor-severe = "#702c00"
fgColor-done = "#5e2bb4"
fgColor-onEmphasis = "#ffffff"
display-cyan-fgColor = "#004857"
display-teal-fgColor = "#0a4852"
prettylights-syntax-comment = "#59636e"
prettylights-syntax-constant = "#023b95"
prettylights-syntax-entity = "#512598"
prettylights-syntax-entityTag = "#023b95"
prettylights-syntax-keyword = "#a0111f"
prettylights-syntax-string = "#032563"
prettylights-syntax-variable = "#702c00"

[roles]
# Its bgColor-neutral-muted is opaque.
chip = "bgColor-neutral-muted"
# GitHub Light's roles moved to its floor, back to this theme's own tokens, which reach it.
marked = "fgColor-attention"
ink-faint = "fgColor-disabled"
action = "fgColor-accent"
needs-you = "fgColor-severe"
changed = "fgColor-done"
added = "fgColor-success"
removed = "fgColor-danger"
caution = "fgColor-attention"
context = "fgColor-accent"
yours = "fgColor-accent"
link = "fgColor-accent"
working = "fgColor-accent"
mode-normal = "fgColor-accent"
mode-insert = "fgColor-success"
mode-visual = "fgColor-done"
mode-replace = "fgColor-danger"
mode-command = "fgColor-severe"
syntax-keyword = "prettylights-syntax-keyword"
syntax-operator = "prettylights-syntax-keyword"
# The design language's heights, glass, and light: not published, mixed from the colours above.
raised = "#ffffff"
backdrop = "#e1e1e1"
well = "#f0f0f0"
rule-quiet = "#adb0b4"
glass-tint = "#ffffff"
backdrop-wash-1 = "fgColor-accent"
backdrop-wash-2 = "fgColor-done"
light-focus = "fgColor-accent"
light-focus-2 = "fgColor-done"
light-running = "display-teal-fgColor"
