#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# GitHub Dark, from @primer/primitives v11.10.0's functional tokens (dark.css), MIT:
# https://unpkg.com/@primer/primitives@11.10.0/dist/css/functional/themes/dark.css
name = "GitHub Dark"
mode = "dark"

[palette]
bgColor-default = "#0d1117"
bgColor-muted = "#151b23"
bgColor-inset = "#010409"
bgColor-neutral-muted = "#656c7633"
bgColor-accent-muted = "#388bfd1a"
borderColor-emphasis = "#656c76"
fgColor-default = "#f0f6fc"
fgColor-muted = "#9198a1"
fgColor-disabled = "#656c76"
fgColor-accent = "#4493f8"
fgColor-success = "#3fb950"
fgColor-danger = "#f85149"
fgColor-attention = "#d29922"
fgColor-severe = "#db6d28"
fgColor-done = "#ab7df8"
fgColor-onEmphasis = "#ffffff"
display-cyan-fgColor = "#07ace4"
display-teal-fgColor = "#1cb0ab"
prettylights-syntax-comment = "#9198a1"
prettylights-syntax-constant = "#79c0ff"
prettylights-syntax-entity = "#d2a8ff"
prettylights-syntax-entityTag = "#7ee787"
prettylights-syntax-keyword = "#ff7b72"
prettylights-syntax-string = "#a5d6ff"
prettylights-syntax-variable = "#ffa657"
# Not GitHub's: bgColor-neutral-muted laid over bgColor-default, by its alpha.
neutral-muted-tint = "#1f232a"
# Not GitHub's: bgColor-accent-muted laid over bgColor-default, by its alpha.
accent-muted-tint = "#111d2e"
# Not GitHub's: each published colour lightened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
fgColor-disabled-floor = "#7e8690"

[roles]
page = "bgColor-default"
raised = "bgColor-muted"
sunken = "bgColor-inset"
chip = "neutral-muted-tint"
cursor-row = "accent-muted-tint"
marked = "fgColor-attention"
rule = "borderColor-emphasis"
pane-title = "fgColor-default"
ink = "fgColor-default"
ink-quiet = "fgColor-muted"
ink-faint = "fgColor-disabled-floor"
action = "fgColor-accent"
on-action = "bgColor-inset"
needs-you = "fgColor-severe"
changed = "fgColor-done"
added = "fgColor-success"
removed = "fgColor-danger"
caution = "fgColor-attention"
context = "fgColor-accent"
yours = "fgColor-accent"
link = "fgColor-accent"
working = "fgColor-accent"
live = "display-cyan-fgColor"
example = "display-teal-fgColor"
sub-agent = "display-teal-fgColor"
heading-1 = "fgColor-default"
heading-2 = "fgColor-default"
heading-3 = "fgColor-default"
code-inline = "fgColor-default"
quote = "fgColor-muted"
mode-normal = "fgColor-accent"
mode-insert = "fgColor-success"
mode-visual = "fgColor-done"
mode-replace = "fgColor-danger"
mode-command = "fgColor-severe"
code-ground = "bgColor-muted"
syntax-keyword = "prettylights-syntax-keyword"
syntax-string = "prettylights-syntax-string"
syntax-comment = "prettylights-syntax-comment"
syntax-number = "prettylights-syntax-constant"
syntax-constant = "prettylights-syntax-constant"
syntax-function = "prettylights-syntax-entity"
syntax-type = "prettylights-syntax-variable"
syntax-operator = "prettylights-syntax-keyword"
syntax-property = "prettylights-syntax-constant"
syntax-punctuation = "fgColor-default"
syntax-tag = "prettylights-syntax-entityTag"
syntax-attribute = "prettylights-syntax-entity"
syntax-variable = "fgColor-default"
