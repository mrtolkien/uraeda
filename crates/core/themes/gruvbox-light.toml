#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Gruvbox Light, contrast "medium", from Gruvbox's colors/gruvbox.vim at commit ef8864b, MIT/X11:
# https://github.com/morhetz/gruvbox/blob/ef8864bb42bf244f0295d1c5a403b27e3d139695/colors/gruvbox.vim
name = "Gruvbox Light"
mode = "light"

[palette]
dark0_hard = "#1d2021"
dark0 = "#282828"
dark0_soft = "#32302f"
dark1 = "#3c3836"
dark2 = "#504945"
dark3 = "#665c54"
dark4 = "#7c6f64"
gray_245 = "#928374"
gray_244 = "#928374"
light0_hard = "#f9f5d7"
light0 = "#fbf1c7"
light0_soft = "#f2e5bc"
light1 = "#ebdbb2"
light2 = "#d5c4a1"
light3 = "#bdae93"
light4 = "#a89984"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_purple = "#d3869b"
bright_aqua = "#8ec07c"
bright_orange = "#fe8019"
neutral_red = "#cc241d"
neutral_green = "#98971a"
neutral_yellow = "#d79921"
neutral_blue = "#458588"
neutral_purple = "#b16286"
neutral_aqua = "#689d6a"
neutral_orange = "#d65d0e"
faded_red = "#9d0006"
faded_green = "#79740e"
faded_yellow = "#b57614"
faded_blue = "#076678"
faded_purple = "#8f3f71"
faded_aqua = "#427b58"
faded_orange = "#af3a03"
# Not Gruvbox's: its colours darkened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (R4).
dark4-floor = "#776a60"
faded_orange-floor = "#aa3903"
faded_green-floor = "#65600c"
gray_244-floor = "#6d6155"
faded_aqua-floor = "#396a4c"
faded_yellow-floor = "#85570f"
light3-floor = "#9e8861"
# Not Gruvbox's: Uraeda's own mix for the row under the cursor, which Gruvbox draws in light1, the
# chip's tone here: faded_blue, its accent, at 10% over light0, as Catppuccin Latte's cursor row is
# its accent at 10% over its page.
faded_blue-tint = "#e3e3bf"

[roles]
page = "light0"
raised = "light0_hard"
sunken = "light0_hard"
chip = "light1"
cursor-row = "faded_blue-tint"
marked = "faded_yellow-floor"
rule = "#98835e"
pane-title = "faded_green-floor"
ink = "dark1"
ink-quiet = "dark3"
ink-faint = "gray_244-floor"
action = "faded_blue"
on-action = "light0"
needs-you = "faded_orange-floor"
changed = "faded_purple"
added = "faded_green-floor"
removed = "faded_red"
caution = "faded_yellow-floor"
context = "faded_blue"
yours = "faded_blue"
link = "faded_blue"
working = "faded_blue"
live = "faded_aqua-floor"
example = "faded_aqua-floor"
sub-agent = "faded_aqua-floor"
heading-1 = "faded_green-floor"
heading-2 = "faded_yellow-floor"
heading-3 = "faded_aqua-floor"
code-inline = "faded_aqua-floor"
quote = "gray_244-floor"
mode-normal = "dark4-floor"
mode-insert = "faded_blue"
mode-visual = "faded_orange-floor"
mode-replace = "faded_aqua-floor"
mode-command = "faded_green-floor"
code-ground = "light0_hard"
syntax-keyword = "faded_red"
syntax-string = "faded_green-floor"
syntax-comment = "gray_244-floor"
syntax-number = "faded_purple"
syntax-constant = "faded_purple"
syntax-function = "faded_green-floor"
syntax-type = "faded_yellow-floor"
syntax-operator = "dark1"
syntax-property = "faded_blue"
syntax-punctuation = "dark4-floor"
syntax-tag = "faded_aqua-floor"
syntax-attribute = "faded_aqua-floor"
syntax-variable = "dark1"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#e4dbb6"
well = "#f5ecc3"
rule-quiet = "#cfc199"
glass-tint = "#f9f5d7"
backdrop-wash-1 = "faded_blue"
backdrop-wash-2 = "faded_purple"
light-focus = "faded_blue"
light-focus-2 = "faded_purple"
light-running = "faded_aqua-floor"
