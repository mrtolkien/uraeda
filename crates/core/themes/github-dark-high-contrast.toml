#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# GitHub Dark High Contrast, from @primer/primitives v11.10.0's functional tokens
# (dark-high-contrast.css), MIT:
# https://unpkg.com/@primer/primitives@11.10.0/dist/css/functional/themes/dark-high-contrast.css
# GitHub Dark's roles, drawn in this theme's tokens.
name = "GitHub Dark High Contrast"
extends = "github-dark"

[palette]
bgColor-default = "#010409"
bgColor-muted = "#151b23"
bgColor-inset = "#010409"
bgColor-neutral-muted = "#212830"
bgColor-accent-muted = "#5cacff1a"
borderColor-emphasis = "#b7bdc8"
fgColor-default = "#ffffff"
fgColor-muted = "#b7bdc8"
fgColor-disabled = "#656c76"
fgColor-accent = "#74b9ff"
fgColor-success = "#2bd853"
fgColor-danger = "#ff9492"
fgColor-attention = "#f0b72f"
fgColor-severe = "#fe9a2d"
fgColor-done = "#d3abff"
fgColor-onEmphasis = "#ffffff"
display-cyan-fgColor = "#45cbf7"
display-teal-fgColor = "#24d6c4"
prettylights-syntax-comment = "#9198a1"
prettylights-syntax-constant = "#91cbff"
prettylights-syntax-entity = "#dbb7ff"
prettylights-syntax-entityTag = "#72f088"
prettylights-syntax-keyword = "#ff9492"
prettylights-syntax-string = "#addcff"
prettylights-syntax-variable = "#ffb757"
# Not GitHub's: bgColor-accent-muted laid over bgColor-default, by its alpha.
accent-muted-tint = "#0a1522"
# Not GitHub's: each published colour lightened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
fgColor-disabled-floor = "#7b838e"

[roles]
# Its bgColor-neutral-muted is opaque.
chip = "bgColor-neutral-muted"
