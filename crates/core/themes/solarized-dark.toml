#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Solarized Dark, from Ethan Schoonover's Solarized at 62f656a, MIT:
# https://github.com/altercation/solarized/blob/62f656a02f93c5190a8753159e34b385588d5ff3/README.md
# Roles follow its own Vim colour scheme, dark background.
name = "Solarized Dark"
mode = "dark"

[palette]
base03 = "#002b36"
base02 = "#073642"
base01 = "#586e75"
base00 = "#657b83"
base0 = "#839496"
base1 = "#93a1a1"
base2 = "#eee8d5"
base3 = "#fdf6e3"
yellow = "#b58900"
orange = "#cb4b16"
red = "#dc322f"
magenta = "#d33682"
violet = "#6c71c4"
blue = "#268bd2"
cyan = "#2aa198"
green = "#859900"
# Not Solarized's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
base01-floor = "#8ba0a7"
base00-floor = "#687f87"
base0-floor = "#91a0a1"
yellow-floor = "#c29300"
orange-floor = "#ec7a4c"
red-floor = "#e87a78"
magenta-floor = "#e175a9"
violet-floor = "#9599d5"
blue-floor = "#52a5e0"
cyan-floor = "#2eb2a8"
green-floor = "#92a800"
# Not Solarized's: Uraeda's own mix for the row under the cursor, which Solarized draws in base02,
# the tone of raised panes and chips here: blue, its accent, at 14% over base03, as Catppuccin's
# cursor row is its accent at 14% over its page.
blue-tint = "#05384c"

[roles]
page = "base03"
raised = "base02"
sunken = "base03"
chip = "base02"
cursor-row = "blue-tint"
# Solarized's three tones of content, in its order: base1 emphasised, base0 body text, base01
# secondary. At the floor, base01's step reads brighter than base0's, so the text takes base1, what
# reads second base0, and faint text base01. base01's floor step for text is too light for a rule,
# which takes base00's own step.
rule = "base00-floor"
ink = "base1"
ink-quiet = "base0-floor"
ink-faint = "base01-floor"
on-action = "base03"
quote = "base01-floor"
code-ground = "base02"
syntax-comment = "base01-floor"
syntax-punctuation = "base01-floor"
syntax-variable = "base0-floor"
marked = "yellow-floor"
pane-title = "violet-floor"
action = "blue-floor"
needs-you = "orange-floor"
changed = "violet-floor"
added = "green-floor"
removed = "red-floor"
caution = "yellow-floor"
context = "blue-floor"
yours = "blue-floor"
link = "blue-floor"
working = "blue-floor"
live = "cyan-floor"
example = "cyan-floor"
sub-agent = "cyan-floor"
heading-1 = "orange-floor"
heading-2 = "blue-floor"
heading-3 = "green-floor"
code-inline = "cyan-floor"
mode-normal = "blue-floor"
mode-insert = "green-floor"
mode-visual = "magenta-floor"
mode-replace = "red-floor"
mode-command = "orange-floor"
syntax-keyword = "green-floor"
syntax-string = "cyan-floor"
syntax-number = "cyan-floor"
syntax-constant = "cyan-floor"
syntax-function = "blue-floor"
syntax-type = "yellow-floor"
syntax-operator = "green-floor"
syntax-property = "blue-floor"
syntax-tag = "blue-floor"
syntax-attribute = "yellow-floor"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#00191f"
well = "#00212a"
rule-quiet = "#254953"
glass-tint = "#00212a"
backdrop-wash-1 = "blue-floor"
backdrop-wash-2 = "violet-floor"
light-focus = "blue-floor"
light-focus-2 = "violet-floor"
light-running = "cyan-floor"
