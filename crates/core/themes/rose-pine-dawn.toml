#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Rosé Pine Dawn, from Rosé Pine's palette v4.0.1, its palette.json and source/index.ts at 92af52b,
# MIT: https://github.com/rose-pine/palette/blob/92af52b465ab6e47437aca223c9b8d3009a2023b/palette.json
# Roles follow the Neovim port, rose-pine/neovim.
name = "Rosé Pine Dawn"
mode = "light"

[palette]
base = "#faf4ed"
surface = "#fffaf3"
overlay = "#f2e9e1"
muted = "#9893a5"
subtle = "#797593"
text = "#464261"
love = "#b4637a"
gold = "#ea9d34"
rose = "#d7827e"
pine = "#286983"
foam = "#56949f"
iris = "#907aa9"
highlightLow = "#f4ede8"
highlightMed = "#dfdad9"
highlightHigh = "#cecacd"
# Not Rosé Pine's: its colours darkened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
muted-floor = "#888297"
subtle-floor = "#64607b"
love-floor = "#9b4b61"
gold-floor = "#8f590f"
rose-floor = "#af3c36"
foam-floor = "#3f6c74"
iris-floor = "#715a8b"

[roles]
page = "base"
raised = "surface"
sunken = "overlay"
chip = "overlay"
cursor-row = "overlay"
marked = "gold-floor"
# Dawn's muted is under the floor both as a rule and as faint text, and one step of it cannot
# serve both without a heavy rule: the rule takes muted's step, and faint text quiet text's, a
# step apart from muted's.
rule = "muted-floor"
pane-title = "foam-floor"
ink = "text"
ink-quiet = "subtle-floor"
ink-faint = "subtle-floor"
action = "iris-floor"
on-action = "surface"
needs-you = "rose-floor"
changed = "rose-floor"
added = "foam-floor"
removed = "love-floor"
caution = "gold-floor"
context = "foam-floor"
yours = "iris-floor"
link = "iris-floor"
working = "foam-floor"
live = "pine"
example = "pine"
sub-agent = "pine"
heading-1 = "iris-floor"
heading-2 = "foam-floor"
heading-3 = "rose-floor"
code-inline = "gold-floor"
quote = "subtle-floor"
mode-normal = "rose-floor"
mode-insert = "foam-floor"
mode-visual = "iris-floor"
mode-replace = "pine"
mode-command = "love-floor"
code-ground = "overlay"
syntax-keyword = "pine"
syntax-string = "gold-floor"
syntax-comment = "subtle-floor"
syntax-number = "gold-floor"
syntax-constant = "gold-floor"
syntax-function = "rose-floor"
syntax-type = "foam-floor"
syntax-operator = "subtle-floor"
syntax-property = "foam-floor"
syntax-punctuation = "subtle-floor"
syntax-tag = "foam-floor"
syntax-attribute = "iris-floor"
syntax-variable = "text"
