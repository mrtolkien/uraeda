#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Tokyo Night, from folke's tokyonight.nvim v4.14.1, its Night style, Apache 2.0:
# https://github.com/folke/tokyonight.nvim/blob/v4.14.1/lua/tokyonight/colors/night.lua
# Roles follow its own highlight groups.
name = "Tokyo Night"
mode = "dark"

[palette]
bg = "#1a1b26"
bg_dark = "#16161e"
bg_dark1 = "#0c0e14"
bg_highlight = "#292e42"
blue = "#7aa2f7"
blue0 = "#3d59a1"
blue1 = "#2ac3de"
blue2 = "#0db9d7"
blue5 = "#89ddff"
blue6 = "#b4f9f8"
blue7 = "#394b70"
comment = "#565f89"
cyan = "#7dcfff"
dark3 = "#545c7e"
dark5 = "#737aa2"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
fg_gutter = "#3b4261"
green = "#9ece6a"
green1 = "#73daca"
green2 = "#41a6b5"
magenta = "#bb9af7"
magenta2 = "#ff007c"
orange = "#ff9e64"
purple = "#9d7cd8"
red = "#f7768e"
red1 = "#db4b4b"
teal = "#1abc9c"
terminal_black = "#414868"
yellow = "#e0af68"
# tokyonight.nvim's own bg_visual, which colors/init.lua computes: blue0 at 40% over bg.
bg_visual = "#283457"
# Not Tokyo Night's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
comment-floor = "#989ebe"
dark3-floor = "#5e678d"

[roles]
page = "bg"
raised = "#262734"
sunken = "bg_dark1"
chip = "bg_highlight"
cursor-row = "bg_visual"
marked = "yellow"
rule = "#666f95"
pane-title = "blue1"
ink = "fg"
ink-quiet = "fg_dark"
ink-faint = "comment-floor"
action = "blue"
on-action = "bg_dark"
needs-you = "orange"
changed = "magenta"
added = "green"
removed = "red"
caution = "yellow"
context = "blue"
yours = "blue"
link = "blue"
working = "blue"
live = "cyan"
example = "teal"
sub-agent = "teal"
heading-1 = "blue"
heading-2 = "yellow"
heading-3 = "green"
code-inline = "blue"
quote = "fg_dark"
mode-normal = "blue"
mode-insert = "green"
mode-visual = "magenta"
mode-replace = "red"
mode-command = "yellow"
code-ground = "bg_dark"
syntax-keyword = "purple"
syntax-string = "green"
syntax-comment = "comment-floor"
syntax-number = "orange"
syntax-constant = "orange"
syntax-function = "blue"
syntax-type = "blue1"
syntax-operator = "blue5"
syntax-property = "green1"
syntax-punctuation = "blue5"
syntax-tag = "red"
syntax-attribute = "green1"
syntax-variable = "fg"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#0f0f16"
well = "#14151d"
rule-quiet = "#35394e"
glass-tint = "#14151d"
backdrop-wash-1 = "blue"
backdrop-wash-2 = "magenta"
light-focus = "blue"
light-focus-2 = "magenta"
light-running = "teal"
