#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# One Light, from Atom's one-light-syntax 1.8.4 (commit d845790), MIT: styles/colors.less, its HSL
# written as hex, and styles/syntax-variables.less.
# https://github.com/atom/one-light-syntax/blob/d84579027410c576086dfca14d934c4bd74b0438/styles/colors.less
name = "One Light"
mode = "light"

[palette]
mono-1 = "#383a42"
mono-2 = "#696c77"
mono-3 = "#a0a1a7"
hue-1 = "#0184bc"
hue-2 = "#4078f2"
hue-3 = "#a626a4"
hue-4 = "#50a14f"
hue-5 = "#e45649"
hue-5-2 = "#ca1243"
hue-6 = "#986801"
hue-6-2 = "#c18401"
syntax-bg = "#fafafa"
syntax-gutter = "#9d9d9f"
syntax-accent = "#526fff"
# Not One's as written: syntax-variables.less's syntax-cursor-line, fade(mono-1, 5%), laid over
# syntax-bg to be opaque.
syntax-cursor-line = "#f0f0f1"
# Atom's one-light-ui 1.12.5 (commit a27bce3), MIT, from its ui-variables-custom.less computed over
# One Light's background: level-3, its panels, darken(syntax-bg, 6%); level-1, its buttons,
# lighten(syntax-bg, 4%); ui-border, darken(level-3, 6%).
# https://github.com/atom/one-light-ui/blob/a27bce35088ecd323e44f5c2510bcf2d4e9efcf8/styles/ui-variables-custom.less
level-3 = "#eaeaeb"
level-1 = "#ffffff"
ui-border = "#dbdbdc"
# Not One's: its colours darkened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (R4).
syntax-accent-floor = "#2e51ff"
mono-3-floor = "#67686f"
syntax-gutter-floor = "#868688"
mono-2-floor = "#5d606a"
hue-3-floor = "#a225a0"
hue-5-floor = "#b6281b"
hue-6-floor = "#7f5701"
hue-1-floor = "#016793"
hue-6-2-floor = "#895e01"
hue-4-floor = "#356a34"
hue-2-floor = "#1a5def"

[roles]
page = "syntax-bg"
raised = "#fefefe"
sunken = "level-3"
chip = "ui-border"
cursor-row = "syntax-cursor-line"
marked = "hue-6-2-floor"
rule = "syntax-gutter-floor"
pane-title = "hue-2-floor"
ink = "mono-1"
ink-quiet = "mono-2-floor"
ink-faint = "mono-3-floor"
action = "syntax-accent-floor"
on-action = "level-1"
needs-you = "hue-6-floor"
changed = "hue-3-floor"
added = "hue-4-floor"
removed = "hue-5-floor"
caution = "hue-6-2-floor"
context = "hue-2-floor"
yours = "hue-2-floor"
link = "hue-1-floor"
working = "hue-2-floor"
live = "hue-1-floor"
example = "hue-1-floor"
sub-agent = "hue-1-floor"
heading-1 = "hue-5-floor"
heading-2 = "hue-2-floor"
heading-3 = "hue-3-floor"
code-inline = "hue-4-floor"
quote = "hue-6-floor"
mode-normal = "hue-4-floor"
mode-insert = "hue-2-floor"
mode-visual = "hue-3-floor"
mode-replace = "hue-5-floor"
mode-command = "hue-6-2-floor"
code-ground = "level-3"
syntax-keyword = "hue-3-floor"
syntax-string = "hue-4-floor"
syntax-comment = "mono-3-floor"
syntax-number = "hue-6-floor"
syntax-constant = "hue-6-floor"
syntax-function = "hue-2-floor"
syntax-type = "hue-6-2-floor"
syntax-operator = "hue-1-floor"
syntax-property = "hue-5-floor"
syntax-punctuation = "mono-1"
syntax-tag = "hue-5-floor"
syntax-attribute = "hue-6-floor"
syntax-variable = "mono-1"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#e3e3e4"
well = "#f7f7f7"
rule-quiet = "#c7c7c8"
glass-tint = "#ffffff"
backdrop-wash-1 = "syntax-accent-floor"
backdrop-wash-2 = "hue-2-floor"
light-focus = "syntax-accent-floor"
light-focus-2 = "hue-2-floor"
light-running = "hue-1-floor"
