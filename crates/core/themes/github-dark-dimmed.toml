#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# GitHub Dark Dimmed, from @primer/primitives v11.10.0's functional tokens (dark-dimmed.css), MIT:
# https://unpkg.com/@primer/primitives@11.10.0/dist/css/functional/themes/dark-dimmed.css
# GitHub Dark's roles, drawn in this theme's tokens.
name = "GitHub Dark Dimmed"
extends = "github-dark"

[palette]
bgColor-default = "#212830"
bgColor-muted = "#262c36"
bgColor-inset = "#151b23"
bgColor-neutral-muted = "#656c7633"
bgColor-accent-muted = "#4184e41a"
borderColor-emphasis = "#656c76"
fgColor-default = "#d1d7e0"
fgColor-muted = "#9198a1"
fgColor-disabled = "#656c76"
fgColor-accent = "#478be6"
fgColor-success = "#57ab5a"
fgColor-danger = "#e5534b"
fgColor-attention = "#c69026"
fgColor-severe = "#cc6b2c"
fgColor-done = "#986ee2"
fgColor-onEmphasis = "#f0f6fc"
display-cyan-fgColor = "#07ace4"
display-teal-fgColor = "#1cb0ab"
prettylights-syntax-comment = "#9198a1"
prettylights-syntax-constant = "#6cb6ff"
prettylights-syntax-entity = "#dcbdfb"
prettylights-syntax-entityTag = "#8ddb8c"
prettylights-syntax-keyword = "#f47067"
prettylights-syntax-string = "#96d0ff"
prettylights-syntax-variable = "#f69d50"
# Not GitHub's: bgColor-neutral-muted laid over bgColor-default, by its alpha.
neutral-muted-tint = "#2f363e"
# Not GitHub's: bgColor-accent-muted laid over bgColor-default, by its alpha.
accent-muted-tint = "#243142"
# Not GitHub's: each published colour lightened, a whole percent of HSL lightness at a time,
# to the first step at which every pair its roles are in reaches the contrast floor.
borderColor-emphasis-floor = "#6f7681"
fgColor-muted-floor = "#99a0a8"
fgColor-disabled-floor = "#9198a1"
fgColor-accent-floor = "#6ba2eb"
fgColor-success-floor = "#5faf62"
fgColor-danger-floor = "#ec7f79"
fgColor-attention-floor = "#cd9527"
fgColor-severe-floor = "#db8b57"
fgColor-done-floor = "#b191e9"
prettylights-syntax-keyword-floor = "#f4746c"

[roles]
marked = "fgColor-attention-floor"
rule = "#737a85"
ink-quiet = "fgColor-muted-floor"
action = "fgColor-accent-floor"
needs-you = "fgColor-severe-floor"
changed = "fgColor-done-floor"
added = "fgColor-success-floor"
removed = "fgColor-danger-floor"
caution = "fgColor-attention-floor"
context = "fgColor-accent-floor"
yours = "fgColor-accent-floor"
link = "fgColor-accent-floor"
working = "fgColor-accent-floor"
quote = "fgColor-muted-floor"
mode-normal = "fgColor-accent-floor"
mode-insert = "fgColor-success-floor"
mode-visual = "fgColor-done-floor"
mode-replace = "fgColor-danger-floor"
mode-command = "fgColor-severe-floor"
syntax-keyword = "prettylights-syntax-keyword-floor"
syntax-operator = "prettylights-syntax-keyword-floor"
# The design language's heights, glass, and light: not published, mixed from the colours above.
raised = "#2a3139"
backdrop = "#13171b"
well = "#191f25"
rule-quiet = "#3f464f"
glass-tint = "#191f25"
backdrop-wash-1 = "fgColor-accent-floor"
backdrop-wash-2 = "fgColor-done-floor"
light-focus = "fgColor-accent-floor"
light-focus-2 = "fgColor-done-floor"
light-running = "display-teal-fgColor"
