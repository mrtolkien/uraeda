#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Nord, from Nord's src/nord.css v0.2.0, MIT:
# https://github.com/nordtheme/nord/blob/v0.2.0/src/nord.css
name = "Nord"
mode = "dark"

[palette]
nord0 = "#2e3440"
nord1 = "#3b4252"
nord2 = "#434c5e"
nord3 = "#4c566a"
nord4 = "#d8dee9"
nord5 = "#e5e9f0"
nord6 = "#eceff4"
nord7 = "#8fbcbb"
nord8 = "#88c0d0"
nord9 = "#81a1c1"
nord10 = "#5e81ac"
nord11 = "#bf616a"
nord12 = "#d08770"
nord13 = "#ebcb8b"
nord14 = "#a3be8c"
nord15 = "#b48ead"
# Comments' colour, nord3_gui_bright in Nord's Vim port v0.19.0, MIT:
# https://github.com/nordtheme/vim/blob/v0.19.0/colors/nord.vim
nord3_bright = "#616e88"
# Not Nord's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (R4).
nord8-floor = "#91c5d4"
nord11-floor = "#d9a1a6"
nord15-floor = "#c4a6be"
nord3_bright-floor = "#b5bcca"
nord9-floor = "#98b3cd"
nord3-floor = "#828ea6"
nord12-floor = "#daa290"

[roles]
page = "nord0"
raised = "nord1"
sunken = "nord1"
chip = "nord1"
cursor-row = "nord2"
marked = "nord13"
rule = "nord3-floor"
pane-title = "nord8-floor"
ink = "nord4"
ink-quiet = "nord4"
ink-faint = "nord3_bright-floor"
action = "nord8-floor"
on-action = "nord1"
needs-you = "nord12-floor"
changed = "nord15-floor"
added = "nord14"
removed = "nord11-floor"
caution = "nord13"
context = "nord9-floor"
yours = "nord9-floor"
link = "nord8-floor"
working = "nord9-floor"
live = "nord7"
example = "nord7"
sub-agent = "nord7"
heading-1 = "nord8-floor"
heading-2 = "nord9-floor"
heading-3 = "nord7"
code-inline = "nord7"
quote = "nord4"
mode-normal = "nord8-floor"
mode-insert = "nord6"
mode-visual = "nord7"
mode-replace = "nord13"
mode-command = "nord9-floor"
code-ground = "nord0"
syntax-keyword = "nord9-floor"
syntax-string = "nord14"
syntax-comment = "nord3_bright-floor"
syntax-number = "nord15-floor"
syntax-constant = "nord9-floor"
syntax-function = "nord8-floor"
syntax-type = "nord9-floor"
syntax-operator = "nord9-floor"
syntax-property = "nord4"
syntax-punctuation = "nord6"
syntax-tag = "nord9-floor"
syntax-attribute = "nord7"
syntax-variable = "nord4"
