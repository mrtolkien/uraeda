#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Rosé Pine Moon, from Rosé Pine's palette v4.0.1, its palette.json and source/index.ts at 92af52b,
# MIT: https://github.com/rose-pine/palette/blob/92af52b465ab6e47437aca223c9b8d3009a2023b/source/index.ts
# Its roles are Rosé Pine's, on Moon's palette.
name = "Rosé Pine Moon"
mode = "dark"
extends = "rose-pine"

[palette]
base = "#232136"
surface = "#2a273f"
overlay = "#393552"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlightLow = "#2a283e"
highlightMed = "#44415a"
highlightHigh = "#56526e"
# Not Rosé Pine's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (4.5:1 for text, 3:1 for a
# rule).
muted-floor = "#75718e"
subtle-floor = "#a4a1ba"
love-floor = "#ee82a0"
pine-floor = "#55a3c3"

[roles]
# Moon's muted is under the floor both as a rule and as faint text, and one step of it cannot
# serve both without a heavy rule: the rule takes muted's step, and faint text quiet text's, a
# step apart from muted's.
ink-faint = "subtle-floor"
rule = "muted-floor"
# Moon's love is under the floor, where Rosé Pine's is not.
removed = "love-floor"
mode-command = "love-floor"
