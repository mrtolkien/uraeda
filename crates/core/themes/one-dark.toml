#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# One Dark, from Atom's one-dark-syntax 1.8.4 (commit 9c96f44), MIT: styles/colors.less, its HSL
# written as hex, and styles/syntax-variables.less.
# https://github.com/atom/one-dark-syntax/blob/9c96f4454362267ac45322063e193ccf9d2debb1/styles/colors.less
name = "One Dark"
mode = "dark"

[palette]
mono-1 = "#abb2bf"
mono-2 = "#828997"
mono-3 = "#5c6370"
hue-1 = "#56b6c2"
hue-2 = "#61afef"
hue-3 = "#c678dd"
hue-4 = "#98c379"
hue-5 = "#e06c75"
hue-5-2 = "#be5046"
hue-6 = "#d19a66"
hue-6-2 = "#e5c07b"
syntax-bg = "#282c34"
syntax-gutter = "#636d83"
syntax-accent = "#528bff"
# Not One's as written: syntax-variables.less's syntax-cursor-line, hsla(220, 100%, 80%, 0.04),
# laid over syntax-bg to be opaque.
syntax-cursor-line = "#2d323c"
# Atom's one-dark-ui 1.12.5 (commit 18c2143), MIT, from its ui-variables-custom.less computed over
# One Dark's background: level-3, its panels, darken(syntax-bg, 3%); level-1, its buttons,
# lighten(syntax-bg, 6%).
# https://github.com/atom/one-dark-ui/blob/18c2143d41e17b337fff6dc7024562c4d999be17/styles/ui-variables-custom.less
level-3 = "#21252b"
level-1 = "#353b45"
# Not One's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (R4).
mono-2-floor = "#a6abb5"
mono-3-floor = "#959ba8"
syntax-gutter-floor = "#6c768e"
syntax-accent-floor = "#6698ff"
hue-5-floor = "#e78d94"
hue-3-floor = "#cf8de2"

[roles]
page = "syntax-bg"
raised = "#2f333b"
sunken = "level-3"
chip = "level-1"
cursor-row = "syntax-cursor-line"
marked = "hue-6-2"
rule = "#727c93"
pane-title = "hue-2"
ink = "mono-1"
ink-quiet = "mono-2-floor"
ink-faint = "mono-3-floor"
action = "syntax-accent-floor"
on-action = "level-3"
needs-you = "hue-6"
changed = "hue-3-floor"
added = "hue-4"
removed = "hue-5-floor"
caution = "hue-6-2"
context = "hue-2"
yours = "hue-2"
link = "hue-1"
working = "hue-2"
live = "hue-1"
example = "hue-1"
sub-agent = "hue-1"
heading-1 = "hue-5-floor"
heading-2 = "hue-2"
heading-3 = "hue-3-floor"
code-inline = "hue-4"
quote = "hue-6"
mode-normal = "hue-4"
mode-insert = "hue-2"
mode-visual = "hue-3-floor"
mode-replace = "hue-5-floor"
mode-command = "hue-6-2"
code-ground = "level-3"
syntax-keyword = "hue-3-floor"
syntax-string = "hue-4"
syntax-comment = "mono-3-floor"
syntax-number = "hue-6"
syntax-constant = "hue-6"
syntax-function = "hue-2"
syntax-type = "hue-6-2"
syntax-operator = "hue-1"
syntax-property = "hue-5-floor"
syntax-punctuation = "mono-1"
syntax-tag = "hue-5-floor"
syntax-attribute = "hue-6"
syntax-variable = "mono-1"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#17191e"
well = "#1f2228"
rule-quiet = "#434956"
glass-tint = "#1f2228"
backdrop-wash-1 = "syntax-accent-floor"
backdrop-wash-2 = "hue-2"
light-focus = "syntax-accent-floor"
light-focus-2 = "hue-2"
light-running = "hue-1"
