#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Gruvbox Dark, contrast "medium", from Gruvbox's colors/gruvbox.vim at commit ef8864b, MIT/X11:
# https://github.com/morhetz/gruvbox/blob/ef8864bb42bf244f0295d1c5a403b27e3d139695/colors/gruvbox.vim
name = "Gruvbox Dark"
mode = "dark"

[palette]
dark0_hard = "#1d2021"
dark0 = "#282828"
dark0_soft = "#32302f"
dark1 = "#3c3836"
dark2 = "#504945"
dark3 = "#665c54"
dark4 = "#7c6f64"
gray_245 = "#928374"
gray_244 = "#928374"
light0_hard = "#f9f5d7"
light0 = "#fbf1c7"
light0_soft = "#f2e5bc"
light1 = "#ebdbb2"
light2 = "#d5c4a1"
light3 = "#bdae93"
light4 = "#a89984"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_purple = "#d3869b"
bright_aqua = "#8ec07c"
bright_orange = "#fe8019"
neutral_red = "#cc241d"
neutral_green = "#98971a"
neutral_yellow = "#d79921"
neutral_blue = "#458588"
neutral_purple = "#b16286"
neutral_aqua = "#689d6a"
neutral_orange = "#d65d0e"
faded_red = "#9d0006"
faded_green = "#79740e"
faded_yellow = "#b57614"
faded_blue = "#076678"
faded_purple = "#8f3f71"
faded_aqua = "#427b58"
faded_orange = "#af3a03"
# Not Gruvbox's: its colours lightened, a whole percent of HSL lightness at a time, to the
# first step at which every pair they are in reaches the contrast floor (R4).
bright_purple-floor = "#d68fa2"
gray_245-floor = "#aca195"
bright_red-floor = "#fc7d6e"
bright_blue-floor = "#89a99d"
dark3-floor = "#7b6f65"
# Not Gruvbox's: Uraeda's own mix for the row under the cursor, which Gruvbox draws in dark1, the
# chip's tone here: bright_blue, its accent, at 14% over dark0, as Catppuccin's cursor row is its
# accent at 14% over its page.
bright_blue-tint = "#353a38"

[roles]
page = "dark0"
raised = "#363532"
sunken = "dark0_hard"
chip = "dark1"
cursor-row = "bright_blue-tint"
marked = "bright_yellow"
rule = "#887c6e"
pane-title = "bright_green"
ink = "light1"
ink-quiet = "light3"
ink-faint = "gray_245-floor"
action = "bright_blue-floor"
on-action = "dark0"
needs-you = "bright_orange"
changed = "bright_purple-floor"
added = "bright_green"
removed = "bright_red-floor"
caution = "bright_yellow"
context = "bright_blue-floor"
yours = "bright_blue-floor"
link = "bright_blue-floor"
working = "bright_blue-floor"
live = "bright_aqua"
example = "bright_aqua"
sub-agent = "bright_aqua"
heading-1 = "bright_green"
heading-2 = "bright_yellow"
heading-3 = "bright_aqua"
code-inline = "bright_aqua"
quote = "gray_245-floor"
mode-normal = "light4"
mode-insert = "bright_blue-floor"
mode-visual = "bright_orange"
mode-replace = "bright_aqua"
mode-command = "bright_green"
code-ground = "dark0_hard"
syntax-keyword = "bright_red-floor"
syntax-string = "bright_green"
syntax-comment = "gray_245-floor"
syntax-number = "bright_purple-floor"
syntax-constant = "bright_purple-floor"
syntax-function = "bright_green"
syntax-type = "bright_yellow"
syntax-operator = "light1"
syntax-property = "bright_blue-floor"
syntax-punctuation = "light4"
syntax-tag = "bright_aqua"
syntax-attribute = "bright_aqua"
syntax-variable = "light1"
# The design language's heights, glass, and light: not published, mixed from the colours above.
backdrop = "#171717"
well = "#1f1f1f"
rule-quiet = "#4b4641"
glass-tint = "#1f1f1f"
backdrop-wash-1 = "bright_blue-floor"
backdrop-wash-2 = "bright_purple-floor"
light-focus = "bright_blue-floor"
light-focus-2 = "bright_purple-floor"
light-running = "bright_aqua"
