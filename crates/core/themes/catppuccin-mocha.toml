#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Catppuccin Mocha, from Catppuccin's palette.json v1.8.0, MIT:
# https://github.com/catppuccin/palette/blob/v1.8.0/palette.json
name = "Catppuccin Mocha"
mode = "dark"

[palette]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
# Not Catppuccin's: overlay2 lightened, a whole percent of HSL lightness at a time, to the first
# step at which it reads at 4.5:1 on a selected row.
overlay2-floor = "#979db5"
# Not Catppuccin's: mauve at 14% over base.
mauve-tint = "#36314a"
# Not Catppuccin's: overlay0 lightened the same way, to 3:1 on a raised surface.
overlay0-floor = "#70748b"
# Not Catppuccin's: the raised height's fill, one step above base, and the quiet line between rows,
# between surface0 and surface1.
base-raised = "#2a2b3e"
surface-quiet = "#3b3d52"
# Not Catppuccin's: mantle warmed by 5% of peach, which glass is tinted with.
mantle-warm = "#232029"
# Not Catppuccin's: the light and the shade under a height's top edge, and glass's rim.
white = "#ffffff"
white-lip = "#ffffff17"
black-shade = "#0000006b"

[roles]
page = "base"
raised = "base-raised"
sunken = "crust"
chip = "surface0"
cursor-row = "mauve-tint"
marked = "yellow"
rule = "overlay0-floor"
pane-title = "lavender"
ink = "text"
ink-quiet = "subtext0"
ink-faint = "overlay2-floor"
action = "mauve"
on-action = "crust"
needs-you = "peach"
changed = "mauve"
added = "green"
removed = "red"
caution = "yellow"
context = "blue"
yours = "blue"
link = "blue"
working = "blue"
live = "sapphire"
example = "teal"
sub-agent = "teal"
heading-1 = "mauve"
heading-2 = "blue"
heading-3 = "green"
code-inline = "peach"
quote = "subtext0"
mode-normal = "mauve"
mode-insert = "green"
mode-visual = "blue"
mode-replace = "red"
mode-command = "peach"
code-ground = "mantle"
syntax-keyword = "mauve"
syntax-string = "green"
syntax-comment = "overlay2-floor"
syntax-number = "peach"
syntax-constant = "peach"
syntax-function = "blue"
syntax-type = "yellow"
syntax-operator = "sky"
syntax-property = "lavender"
syntax-punctuation = "overlay2-floor"
syntax-tag = "red"
syntax-attribute = "yellow"
syntax-variable = "text"
backdrop = "crust"
backdrop-wash-1 = "mauve"
backdrop-wash-2 = "blue"
well = "mantle"
rule-quiet = "surface-quiet"
lip = "white-lip"
shade = "black-shade"
glass-tint = "mantle-warm"
glass-rim = "white"
light-focus = "mauve"
light-focus-2 = "blue"
light-running = "teal"
