#:schema https://raw.githubusercontent.com/mrtolkien/uraeda/main/schemas/theme.json
# Catppuccin Mocha, from Catppuccin's palette.json v1.8.0, MIT:
# https://github.com/catppuccin/palette/blob/v1.8.0/palette.json
name = "Catppuccin Mocha"
mode = "dark"

[palette]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
# Not Catppuccin's: overlay2 lightened, a whole percent of HSL lightness at a time, to the first
# step at which it reads at 4.5:1 on a selected row.
overlay2-floor = "#979db5"
# Not Catppuccin's: mauve at 14% over base.
mauve-tint = "#36314a"

[roles]
page = "base"
raised = "mantle"
sunken = "crust"
chip = "surface0"
cursor-row = "mauve-tint"
marked = "yellow"
rule = "overlay0"
pane-title = "lavender"
ink = "text"
ink-quiet = "subtext0"
ink-faint = "overlay2-floor"
action = "mauve"
on-action = "crust"
needs-you = "peach"
changed = "mauve"
added = "green"
removed = "red"
caution = "yellow"
context = "blue"
yours = "blue"
link = "blue"
working = "blue"
live = "sapphire"
example = "teal"
sub-agent = "teal"
heading-1 = "mauve"
heading-2 = "blue"
heading-3 = "green"
code-inline = "peach"
quote = "subtext0"
mode-normal = "blue"
mode-insert = "green"
mode-visual = "mauve"
mode-replace = "red"
mode-command = "peach"
code-ground = "mantle"
syntax-keyword = "mauve"
syntax-string = "green"
syntax-comment = "overlay2-floor"
syntax-number = "peach"
syntax-constant = "peach"
syntax-function = "blue"
syntax-type = "yellow"
syntax-operator = "sky"
syntax-property = "lavender"
syntax-punctuation = "overlay2-floor"
syntax-tag = "red"
syntax-attribute = "yellow"
syntax-variable = "text"
