# A built-in extension: its code is Uraeda's, and turning it off removes it. It has no version of its own.
name = "codex"
title = "Codex"
description = "Runs your installed codex command in sessions."
api = 1
icon = "uraeda:harness-openai"
scope = "global"

[settings.command]
type = "string"
default = "codex"
label = "Command"
help = "The command sessions run."
