[package]
name = "uraeda-vim"
description = "Uraeda's Vim layer: a state machine from keys to editor commands, with no UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# cargo-nextest does not run doctests, and the crate has none.
[lib]
doctest = false

[lints]
workspace = true

[dependencies]
# Characters as a reader counts them: a letter with its accents, an emoji of several code points.
unicode-segmentation = "1.13"
# Columns as a terminal counts them, so `j` and `k` stay under a wide character.
unicode-width = "0.2"

[dev-dependencies]
serde.workspace = true
toml_edit.workspace = true
