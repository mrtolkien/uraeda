# cargo-nextest's profiles. No profile retries a failed test: the toolchain decision runs each test
# once, and a test that fails without a bug is fixed, not retried.

[profile.default]
# A hung test is stopped after 2 minutes (4 periods of 30 seconds), and reported as timed out.
slow-timeout = { period = "30s", terminate-after = 4 }
# A test that leaves a process holding its output fails.
leak-timeout = { period = "500ms", result = "fail" }

# CI's profile, selected with NEXTEST_PROFILE=ci: every test runs, to report every failure at once.
[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "500ms", result = "fail" }

# `vp run coverage`'s profile: the default's settings, without the iCCP bomb's memory test, whose
# 40 MiB bound the instrumentation exceeds. It still runs in `ready`, under the default profile.
[profile.coverage]
default-filter = "not test(an_iccp_bomb_is_read_in_bounded_memory)"
