<!doctype html>
<!-- A throwaway prototype of the colour themes round: the same small Uraeda view drawn in each
     candidate theme, from one palette of roles per theme. The approval of the spec deletes it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colour themes: candidates</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #808080;
        font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 14px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
        color: #fff;
      }
      .bar label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 16px;
      }
      .theme {
        background: var(--base);
        color: var(--text);
        padding: 14px;
      }
      .name {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .name small {
        color: var(--subtext);
        font-weight: 400;
      }
      .pane {
        position: relative;
        border: 1px solid var(--overlay);
        padding: 14px 10px 10px;
        margin-top: 10px;
        background: var(--base);
      }
      .pane.live {
        border: 3px double var(--live);
      }
      .pane > .title {
        position: absolute;
        top: -0.75em;
        left: 8px;
        padding: 0 4px;
        background: var(--base);
        color: var(--title);
      }
      .pane.live > .title {
        color: var(--live);
      }
      h1,
      h2,
      h3 {
        margin: 6px 0;
        font-weight: 600;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        font-size: 16px;
      }
      h3 {
        font-size: 14px;
      }
      .coloured h1 {
        color: var(--h1);
      }
      .coloured h2 {
        color: var(--h2);
      }
      .coloured h3 {
        color: var(--h3);
      }
      p {
        font-family:
          "Inter",
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.4;
        margin: 6px 0;
      }
      .secondary {
        color: var(--subtext);
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 4px 6px;
      }
      .row.selected {
        background: var(--accent-muted);
      }
      .row .count {
        color: var(--subtext);
      }
      .needs {
        border-left: 3px solid var(--orange);
        padding-left: 6px;
        color: var(--orange);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .button {
        padding: 4px 10px;
        border: 1px solid var(--overlay);
        background: var(--mantle);
        color: var(--text);
      }
      .button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .badge {
        padding: 1px 6px;
        font-size: 12px;
        color: var(--on-accent);
      }
      .ok {
        background: var(--green);
      }
      .bad {
        background: var(--red);
      }
      .warn {
        background: var(--yellow);
      }
      .info {
        background: var(--blue);
      }
      pre {
        background: var(--mantle);
        margin: 8px 0 0;
        padding: 8px;
        overflow: auto;
        font-size: 12.5px;
        line-height: 1.45;
      }
      .k {
        color: var(--purple);
      }
      .s {
        color: var(--green);
      }
      .c {
        color: var(--dim);
        font-style: italic;
      }
      .f {
        color: var(--blue);
      }
      .n {
        color: var(--orange);
      }
      .t {
        color: var(--yellow);
      }
      .add {
        background: color-mix(in srgb, var(--green) 18%, var(--mantle));
        display: block;
      }
      .del {
        background: color-mix(in srgb, var(--red) 16%, var(--mantle));
        display: block;
      }
      .hues {
        display: flex;
        gap: 2px;
        margin-top: 8px;
      }
      .hues span {
        flex: 1;
        height: 10px;
      }
      .contrast {
        font-size: 11px;
        color: var(--subtext);
        margin-top: 6px;
      }
      .contrast b {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label><input type="checkbox" id="headings" checked /> Headings coloured by level</label>
      <label
        >Show
        <select id="filter">
          <option value="all">every theme</option>
          <option value="dark">dark themes</option>
          <option value="light">light themes</option>
        </select>
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module" src="themes.js"></script>
  </body>
</html>
