<!doctype html><meta charset="utf-8" /><title>Delete a category</title>
<link rel="stylesheet" href="terminal.css" />
<body class="pad">
  <h1>Inbox · 9 notes</h1>
  <div class="pane">
    <span class="t">UI <small>· 3</small></span>
    <div class="note">I want to try monaspace font family…</div>
  </div>
  <div class="scrim"></div>
  <div class="dlg" style="top: 30%; left: 50%; transform: translateX(-50%); width: min(44ch, 92vw)">
    <span class="t">Delete the category UI</span>
    <p>Delete the 3 notes in UI too?</p>
    <p class="meta">No keeps the notes, in the order they have, under No category.</p>
    <div class="btns"><b>Yes, delete the notes</b> · <b>No, keep the notes</b> · <b>Cancel</b></div>
  </div>
</body>
