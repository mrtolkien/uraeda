<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phone bottom bars on more pages</title>
    <!--
      A throwaway prototype of the round of questions: each page at a 360 px phone's width, its
      body sketched, and its bottom bar as each option draws it. Square, monospace, Catppuccin
      Mocha, the glass's warm tint, as `specs/ui/look-and-feel.md` describes.
    -->
    <style>
      :root {
        --base: #1e1e2e;
        --mantle: #181825;
        --crust: #11111b;
        --surface0: #313244;
        --surface1: #45475a;
        --overlay: #6c7086;
        --subtext: #a6adc8;
        --text: #cdd6f4;
        --mauve: #cba6f7;
        --peach: #fab387;
        --green: #a6e3a1;
        --red: #f38ba8;
        --scrim: color-mix(in srgb, var(--base) 66%, transparent);
        --tint: rgb(255 178 102 / 0.1);
        font-family: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
        color: var(--text);
        background: var(--crust);
      }
      body {
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 1rem;
        margin: 40px 0 4px;
        color: var(--mauve);
      }
      p.lead {
        color: var(--subtext);
        margin: 0 0 16px;
        max-width: 80ch;
        font-size: 0.85rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-size: 0.8rem;
        margin-top: 8px;
        max-width: 360px;
        color: var(--subtext);
      }
      figcaption b {
        color: var(--text);
      }
      .phone {
        position: relative;
        width: 360px;
        height: 640px;
        background: var(--base);
        border: 1px solid var(--surface1);
        overflow: hidden;
        font-size: 13px;
      }
      .tabs {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 4px;
        background: var(--mantle);
        border-bottom: 1px solid var(--surface0);
      }
      .tabs i {
        width: 40px;
        height: 28px;
        background: var(--surface0);
        opacity: 0.6;
      }
      .body {
        padding: 10px 8px 70px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
      }
      .meta {
        color: var(--subtext);
        font-size: 11px;
      }
      .pane {
        border-top: 1px solid var(--surface1);
        padding-top: 4px;
      }
      .pane > .pt {
        font-size: 11px;
        color: var(--subtext);
        margin: -12px 0 6px 8px;
        background: var(--base);
        display: inline-block;
        padding: 0 4px;
      }
      .pane.attention {
        border-color: var(--peach);
      }
      .pane.attention > .pt {
        color: var(--peach);
      }
      .line {
        height: 9px;
        background: var(--surface0);
        margin: 6px 0;
      }
      .line.s {
        width: 60%;
      }
      .line.m {
        width: 85%;
      }
      .btn {
        display: inline-block;
        background: var(--mauve);
        color: var(--crust);
        padding: 6px 12px;
        font-size: 12px;
        margin-top: 4px;
      }
      .btn.ghost {
        background: none;
        color: var(--text);
        border: 1px solid var(--surface1);
      }
      .gone {
        border: 1px dashed var(--red);
        color: var(--red);
        font-size: 11px;
        padding: 6px;
      }
      .glass {
        background-color: var(--scrim);
        background-image: linear-gradient(var(--tint), var(--tint));
        backdrop-filter: blur(7px) saturate(1.8);
        -webkit-backdrop-filter: blur(7px) saturate(1.8);
      }
      .bar {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 44px;
        display: flex;
        padding: 0 4px;
        gap: 4px;
        box-shadow:
          inset 0 1px 0 rgb(255 226 190 / 0.4),
          0 -6px 24px rgb(0 0 0 / 0.24);
      }
      .bar .tile {
        flex: 1 1 0;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
      }
      .tile.accent,
      .tile.open {
        color: var(--mauve);
      }
      .float {
        position: absolute;
        bottom: 8px;
        width: 48px;
        height: 48px;
        box-shadow:
          inset 0 0 0 1px rgb(255 226 190 / 0.4),
          inset 0 1px 1px rgb(255 248 236 / 0.75),
          0 10px 30px rgb(0 0 0 / 0.28);
      }
      .float.right {
        right: 8px;
      }
      .float.left {
        left: 8px;
      }
      .sheet {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        padding: 10px 8px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow:
          inset 0 1px 0 rgb(255 226 190 / 0.4),
          0 -6px 24px rgb(0 0 0 / 0.24);
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgb(17 17 27 / 0.6);
      }
      .sheet .head {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
      }
      .seg {
        display: flex;
        border: 1px solid var(--surface1);
        width: fit-content;
      }
      .seg span {
        padding: 4px 10px;
        font-size: 12px;
      }
      .seg span.on {
        background: var(--surface1);
      }
      .field {
        border: 1px solid var(--surface1);
        padding: 6px;
        font-size: 12px;
      }
      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <h1>Phone bottom bars on more pages</h1>
    <p class="lead">
      Each page at a 360 px phone's width, scrolled a little, its body sketched in grey. The bar's
      tiles are named under each phone. Mauve is the accent: the open companion, or the step
      forward. What the option takes out of the page's body is in a dashed red box.
    </p>
    <div id="out"></div>
    <script>
      const ICONS = {
        list: '<path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/>',
        figures: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        links:
          '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7M6 9v12"/>',
        session: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        next: '<path d="M5 12h14M12 5l7 7-7 7"/>',
        plus: '<path d="M5 12h14M12 5v14"/>',
        start: '<polygon points="7 4 19 12 7 20 7 4"/>',
        commit: '<circle cx="12" cy="12" r="3"/><path d="M3 12h6M15 12h6"/>',
        discard:
          '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
        organize: '<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
        previous: '<path d="M15 18l-6-6 6-6"/>',
        following: '<path d="M9 18l6-6-6-6"/>',
        contents: '<path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/>',
        notes: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
        verdict: '<path d="M20 6L9 17l-5-5"/>',
      };
      const icon = (name) => `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
      const tile = (t, extra = "") =>
        `<div class="tile ${t.accent ? "accent" : ""} ${t.open ? "open" : ""} ${extra}" title="${t.label}">${icon(t.icon)}</div>`;

      /** The bar by its count: 1 a button at the bottom right, 2 a button in each corner, 3+ the bar. */
      function bar(tiles) {
        if (tiles.length === 0) return "";
        if (tiles.length === 1) return tile(tiles[0], "glass float right");
        if (tiles.length === 2)
          return tile(tiles[0], "glass float left") + tile(tiles[1], "glass float right");
        return `<div class="bar glass">${tiles.map((t) => tile(t)).join("")}</div>`;
      }

      const L = (n = 3, cls = "") =>
        Array.from(
          { length: n },
          (_, i) => `<div class="line ${i === n - 1 ? "s" : cls}"></div>`,
        ).join("");
      const pane = (title, inner, cls = "") =>
        `<div class="pane ${cls}"><span class="pt">${title}</span>${inner}</div>`;
      const gone = (what) => `<div class="gone">${what}: moves to the bar</div>`;

      const BODIES = {
        feature: (opts = {}) => `
          <div class="title">Recurring tasks</div><div class="meta">Feature · Oct 6 · branch 2026-10-06-recurring-tasks</div>
          ${pane("Next", `<b>Answer the questions</b><div class="meta">Round 01 waits on you: 6 questions</div>${opts.nextButton === false ? "" : '<span class="btn">Answer the questions</span>'}`, "attention")}
          ${opts.sessions === false ? gone("Sessions") : pane("Sessions", L(2))}
          ${pane("Timeline", L(5, "m"))}
          ${opts.column === false ? gone("Produced so far, and Links") : pane("Produced so far", L(4)) + pane("Links", L(2))}`,
        editor: (opts = {}) => `
          <div class="title">Keyboard shortcuts</div><div class="meta">specs/proposals/keyboard-shortcuts.md</div>
          ${pane("Proposal", L(14, "m"))}
          ${opts.start === false ? gone("Start") : pane("Start", '<div class="seg"><span class="on">Feature</span><span>Change</span></div><div class="field">keyboard-shortcuts</div><span class="btn">Start</span>')}`,
        inbox: () => `
          <div class="title">Inbox · 10</div>
          ${pane("No category", L(4, "m"))}${pane("UI", L(6, "m"))}${pane("CLI", L(4, "m"))}`,
        priorities: () => `
          <div class="title">Priorities</div>
          ${pane("Now", L(5, "m"))}${pane("Next", L(4, "m"))}${pane("Later", L(4, "m"))}`,
        commit: (opts = {}) => `
          <div class="title">Commit</div><div class="meta">12 changes</div>
          ${pane("This commit holds", L(16, "m"))}
          ${opts.buttons === false ? gone("Commit and Discard") : '<div><span class="btn">Commit ⏎</span> <span class="btn ghost">Discard</span></div>'}`,
        plan: () =>
          `<div class="title">Plan</div>${pane("Task 1", L(6, "m"))}${pane("Task 2", L(6, "m"))}`,
        decision: () =>
          `<div class="title">Constitution</div>${pane("I. Humans stay in control", L(10, "m"))}`,
        round: () =>
          `<div class="title">Clarifications, round 01</div>${pane("Q1", L(8, "m"))}${pane("Q2", L(6, "m"))}`,
      };

      function phone(body, tiles, extra = "") {
        return `<div class="phone"><div class="tabs">${"<i></i>".repeat(8)}</div><div class="body">${body}</div>${bar(tiles)}${extra}</div>`;
      }
      const figure = (caption, html) =>
        `<figure>${html}<figcaption>${caption}</figcaption></figure>`;
      const T = (icon, label, more = {}) => ({ icon, label, ...more });

      const startSheet = `<div class="dim"></div><div class="sheet glass"><div class="head"><span>Start</span><span>✕</span></div><div class="seg"><span class="on">Feature</span><span>Change</span></div><div class="field">keyboard-shortcuts</div><div class="meta">Names its folder and its branch.</div><span class="btn" style="width:fit-content">Start</span></div>`;

      const SECTIONS = [
        {
          id: "shapes",
          title: "The bar's three shapes, on pages that have a bar today",
          lead: "Your notes: one entry is a single glass button at the bottom right, two are a button in each corner, three or more the full bar.",
          figures: [
            [
              "<b>1 entry</b>: the constitution's reader, its list alone.",
              BODIES.decision(),
              [T("list", "Constitution and decisions")],
            ],
            [
              "<b>2 entries</b>: a plan with no review, its Contents and Session.",
              BODIES.plan(),
              [T("contents", "Contents"), T("session", "Session")],
            ],
            [
              "<b>3 or more</b>: a round, as today: Outline, Notes, Session, Next.",
              BODIES.round(),
              [
                T("list", "Outline"),
                T("notes", "Notes"),
                T("session", "Session"),
                T("next", "Next", { accent: true }),
              ],
            ],
          ],
        },
        {
          id: "feature",
          title: "Q1. The feature page",
          figures: [
            [
              "<b>A (recommended)</b>: Produced, Links, Session, Next. Produced and Links leave the body; Next's pane keeps its words, its button moves to the bar.",
              BODIES.feature({ column: false, nextButton: false }),
              [
                T("figures", "Produced so far"),
                T("links", "Links"),
                T("session", "Session"),
                T("next", "Next step", { accent: true }),
              ],
            ],
            [
              "<b>B</b>: Produced, Links, Next. The sessions stay in the body's pane.",
              BODIES.feature({ column: false, nextButton: false }),
              [
                T("figures", "Produced so far"),
                T("links", "Links"),
                T("next", "Next step", { accent: true }),
              ],
            ],
            ["<b>C</b>: no bar, as today.", BODIES.feature(), []],
          ],
        },
        {
          id: "editor",
          title: "Q2. The draft editor",
          figures: [
            [
              "<b>A (recommended)</b>: Start alone, which opens the Start pane as a sheet; the pane leaves the body.",
              BODIES.editor({ start: false }),
              [T("start", "Start", { accent: true })],
            ],
            ["<b>A</b>, its sheet open.", BODIES.editor({ start: false }), [], startSheet],
            [
              "<b>B</b>: Start jumps to the Start pane, at the body's end, its slug focused.",
              BODIES.editor(),
              [T("start", "Start", { accent: true })],
            ],
          ],
        },
        {
          id: "lists",
          title: "Q3. The inbox and the priorities",
          figures: [
            [
              "<b>A (recommended)</b>: Add alone, which opens the page's add form as a sheet.",
              BODIES.inbox(),
              [T("plus", "Add a note", { accent: true })],
            ],
            [
              "<b>A</b>, on the priorities.",
              BODIES.priorities(),
              [T("plus", "Add a proposal", { accent: true })],
            ],
            [
              "<b>B</b>: on the inbox, Organize with AI too, at the left; it leaves the title's line.",
              BODIES.inbox(),
              [T("organize", "Organize with AI"), T("plus", "Add a note", { accent: true })],
            ],
          ],
        },
        {
          id: "commit",
          title: "Q4. The commit page",
          figures: [
            [
              "<b>A (recommended)</b>: Discard at the left, Commit at the right; the body's buttons leave it. Discard still asks first.",
              BODIES.commit({ buttons: false }),
              [T("discard", "Discard"), T("commit", "Commit", { accent: true })],
            ],
            [
              "<b>B</b>: Commit alone; Commit and Discard stay at the list's end too.",
              BODIES.commit(),
              [T("commit", "Commit", { accent: true })],
            ],
            ["<b>C</b>: no bar, as today.", BODIES.commit(), []],
          ],
        },
      ];

      document.getElementById("out").innerHTML = SECTIONS.map(
        (s) =>
          `<h2 id="${s.id}">${s.title}</h2>${s.lead ? `<p class="lead">${s.lead}</p>` : ""}<div class="row">${s.figures
            .map(([caption, body, tiles, extra]) => figure(caption, phone(body, tiles, extra)))
            .join("")}</div>`,
      ).join("");
    </script>
  </body>
</html>
