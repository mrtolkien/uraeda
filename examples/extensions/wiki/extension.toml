# The Wiki: a repository's documentation folder as a place of Uraeda, `Space w`, and a pane of
# Home. The worked example of docs/extensions.md.
name = "wiki"
title = "Wiki"
description = "The Markdown pages of a repository's documentation folder."
version = "0.2.0"
api = 1
icon = "book-open"
scope = "repository"
server = "server.ts"
page = "page.tsx"

[settings.folder]
type = "string"
default = "docs"
label = "Folder"
help = "The folder of the repository the pages are read from."
