[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "mrtolkien/homebrew-tap"
# Publish jobs to run in CI: our Homebrew job adds Tab completion to the formula dist generates
publish-jobs = ["./publish-homebrew"]
# The app for a browser, built once, before `ura`, which holds it on every platform:
# `.github/workflows/build-web.yml` runs `just web-build` in the dev shell, and the steps of
# `.github/build-setup.yml` put its files where each build of `ura` reads them
plan-jobs = ["./build-web"]
github-build-setup = "../build-setup.yml"
# The Linux app, its tarball and its AppImage, built from the same tag and released with `ura`:
# `.github/workflows/build-app.yml`, which runs `just package` in the dev shell
global-artifacts-jobs = ["./build-app"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build each package alone: a workspace build would build the Linux app's crates on every platform
precise-builds = true
# The release workflow runs on tags only: CI runs `dist plan` on pull requests
pr-run-mode = "skip"
