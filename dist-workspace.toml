[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "mrtolkien/homebrew-tap"
# Publish jobs to run in CI: our Homebrew job adds Tab completion to the formula dist generates
publish-jobs = ["./publish-homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build each package alone: a workspace build turns on the binding's napi feature in `ura`
precise-builds = true
# The release workflow runs on tags only: CI runs `dist plan` on pull requests
pr-run-mode = "skip"
