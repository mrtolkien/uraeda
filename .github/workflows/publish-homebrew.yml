# Publishes the Homebrew formula dist generates to the tap, as dist's own job does, with Tab
# completion added: dist's formula installs only the binary (axodotdev/cargo-dist#2429). The
# release workflow calls it, from `publish-jobs` in dist-workspace.toml.
name: Publish the Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-homebrew-formula:
    runs-on: "ubuntu-22.04"
    env:
      PLAN: ${{ inputs.plan }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          repository: "mrtolkien/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # Homebrew runs `COMPLETE=<shell> ura` at install time, and installs each script where its
      # shell finds it. Fails when dist's formula no longer has the line it goes after.
      - name: Add Tab completion to the formula
        run: |
          formula=Formula/ura.rb
          grep -qx '    install_binary_aliases!' "$formula"
          sed -i 's/^    install_binary_aliases!$/&\n    generate_completions_from_executable(bin\/"ura", shell_parameter_format: :clap, shells: [:fish, :zsh])/' "$formula"
          grep -q 'generate_completions_from_executable' "$formula"
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push
