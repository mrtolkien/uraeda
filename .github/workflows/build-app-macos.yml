# Builds the Mac app's package for a release, `just package-macos` in the dev shell: the zip of
# `Uraeda.app`, with `ura` inside, and its `.sha256`, from the commit of the tag that releases `ura`,
# so it carries the version of the workspace's `Cargo.toml`. `release.yml` calls it, from
# `global-artifacts-jobs` in dist-workspace.toml, and its `host` job releases what it uploads with
# `ura`'s archives, once every build passed, as it does the Linux app (`build-app.yml`).
name: Build the Mac app

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-app-macos:
    # NSH's AppKit runner and the app build on Apple silicon, with Xcode's command line tools.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # The build of CI's `macos` job on `main`, which builds the same: a tag's run reads the
          # default branch's caches, and what it saves no other tag reads.
          cache: macos
          save: false
      - name: Clear the cache's web build
        # Files of another build left beside this release's would go into `ura`.
        run: rm -rf target/web
      - name: Fetch the web build
        # The one `build-web.yml` made for this release, which every `ura` of it holds.
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: target/web
      - name: Build the package
        run: nix develop --command just package-macos
        env:
          URAEDA_WEB_BUILD: ${{ github.workspace }}/target/web
      - name: Check the package carries the release's version
        run: |
          version=$(echo "$PLAN" | jq --raw-output '[.releases[].app_version] | unique | .[]')
          echo "release: $version"
          test "$(echo "$version" | wc -l | tr -d ' ')" = 1
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' target/macos/Uraeda.app/Contents/Info.plist)" = "$version"
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          # `artifacts-*`: the name the `host` job collects and releases.
          name: artifacts-build-app-macos
          path: |
            target/macos/uraeda-app-aarch64-macos.zip
            target/macos/uraeda-app-aarch64-macos.zip.sha256
          if-no-files-found: error
