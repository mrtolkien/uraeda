name: CI

on:
  # Pull requests run it on their branch; pushes run it once merged; a branch can run it by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest revision of a branch needs validation, including on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `ready` runs the full pass, every check of the repository, then fails when its checks changed a
# file, such as a generated one left uncommitted: `crates/xtask/tests/toolchain.rs` checks that a
# job runs it. `release` checks the release's plan and prints the size of `ura`. Validation runs on
# Linux x64 only; the release matrix builds the other platforms.
jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run every check
        # nextest's `ci` profile reports every failure at once.
        env:
          NEXTEST_PROFILE: ci
        run: nix develop --command just ready
      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Check the release plan
        # The release workflow runs on tags only, so its plan is checked here, with the dev
        # shell's cargo-dist, at the version dist-workspace.toml pins.
        run: nix develop --command just release-plan

      - name: Print the size of ura
        # Printed on every run, never tested: see the CLI decision. The `ura` a release ships,
        # with cargo-dist's profile.
        run: |
          nix develop --command cargo build --profile dist -p uraeda-cli
          size=$(stat -c %s target/dist/ura)
          echo "ura: $size bytes"

      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
