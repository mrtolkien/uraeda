name: CI

on:
  # Pull requests run it on their branch; pushes run it once merged; a branch can run it by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest revision of a branch needs validation, including on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job runs one group of `vp run ready`, without Vite Task's cache, then fails when its checks
# changed a file, such as a generated one left uncommitted. The toolchain test checks that every
# group of `ready` has a job. The TypeScript tests are split over several jobs, by Vitest's
# `--shard` (`URAEDA_TEST_SHARD`, see `vite.tasks.ts`), balanced by `scripts/test-shard.ts`: the
# toolchain test checks that the matrix lists every shard, so the jobs together run every test.
# 10 jobs: a free plan runs 20 at once. Validation runs on Linux x64 only; the
# release matrix builds the other platforms.
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run the Rust checks
        # nextest's `ci` profile reports every failure at once.
        env:
          NEXTEST_PROFILE: ci
        run: nix develop --command pnpm exec vp run --no-cache ready:rust
      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run the TypeScript checks
        run: nix develop --command pnpm exec vp run --no-cache ready:typescript
      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  ts-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    env:
      URAEDA_TEST_SHARD: ${{ matrix.shard }}/7
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run a slice of the TypeScript tests
        run: nix develop --command pnpm exec vp run --no-cache ready:ts-test
      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Check the release plan
        # The release workflow runs on tags only, so its plan is checked here.
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          dist plan

      - name: Print the size of ura
        # Printed on every run, never tested: see the CLI decision.
        run: |
          nix develop --command cargo build --release -p uraeda-cli
          size=$(stat -c %s target/release/ura)
          echo "ura: $size bytes"

      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
