name: CI

on:
  # Pull requests run it on their branch; pushes run it once merged; a branch can run it by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest revision of a branch needs validation, including on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `ready` runs the full pass, every check of the repository, then fails when its checks changed a
# file, such as a generated one left uncommitted: `crates/xtask/tests/toolchain.rs` checks that a
# job runs it. `web` builds the app for a browser and opens it, and `release` checks the release's
# plan and packages the Linux app. Validation runs on Linux x64 only; the release matrix builds
# the other platforms.
jobs:
  ready:
    runs-on: ubuntu-latest
    # Its first run builds Native Shell's crates, the app's headless runner, and every test.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run every check
        # nextest's `ci` profile reports every failure at once.
        env:
          NEXTEST_PROFILE: ci
        run: nix develop --command just ready
      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  web:
    runs-on: ubuntu-latest
    # Its first run builds Native Shell's engine and the app's Rust for WebAssembly.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build the web app
        # The app for a browser, as `ura serve` serves it, then what a first load weighs.
        run: nix develop --command just web-build
      - name: Open it in a browser
        # The dev shell's headless Chromium signs in and opens the home page.
        run: nix develop --command just web-test
      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  release:
    runs-on: ubuntu-latest
    # The Linux app's package builds the app's crates in release, from a cold cache at first.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Check the release plan
        # The release workflow runs on tags only, so its plan is checked here, with the dev
        # shell's cargo-dist, at the version dist-workspace.toml pins.
        run: nix develop --command just release-plan

      - name: Package the Linux app
        # As the release builds it (`build-app.yml`): the tarball and the AppImage, whose sizes
        # it prints.
        run: nix develop --command just package

      - name: Print the size of ura
        # Printed on every run, never tested: see the CLI decision.
        run: |
          nix develop --command cargo build --release -p uraeda-cli
          size=$(stat -c %s target/release/ura)
          echo "ura: $size bytes"

      - name: Check the working tree is unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
