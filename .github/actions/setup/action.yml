name: Set up the dev shell
description:
  Nix, for the `flake.nix` dev shell every check runs in, the Rust cache, and the pnpm dependencies.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: Swatinem/rust-cache@v2
      with:
        # One cache for every job, saved from `main` only: pull requests reuse it and never evict it.
        shared-key: ci
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install dependencies
      # Without scripts: `prepare` runs `vp config`, which sets up git hooks and rewrites the
      # Vite+ section of AGENTS.md unwrapped, failing the formatting check.
      run: nix develop --command pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
