<!doctype html>
<!-- An extension's page in a browser: what `app/extensions/host.web.tsx` shows in a frame of its
     own, in place of the Linux host's view `uraeda.extension`. `scripts/web-build.sh` writes it
     as `extension.html` beside the app's page, with that page's runtime and files: the two marks in
     braces below are filled in from it.

     On this machine the frame is at the extension's own host, `<extension>.localhost` on the
     server's port, which a browser runs in a process of its own; elsewhere it is sandboxed without
     an origin. Either way it reaches nothing of the app's: not its storage, not its session's
     cookie. It runs one page, and is loaded again for the next.

     The app names the frame and itself in `uraedaFrame`, `{ secret, app }`: in the address's hash,
     or set before this script. The frame sends to the app's origin alone, every message with the
     secret, which the app checks with the origin, and takes messages from its parent at the app's
     origin alone. It carries; it decides nothing.

     The app sends, as JSON: `{ run: { load, source, capabilities, params } }`, the page verified,
     once; `{ event, data }`, an event for the page's `host.on`; `{ reply, value }` or
     `{ reply, error, code? }`, the answer to a call. The frame sends `{ here: true }` once its
     player runs, then, for the page, `{ load, post, data }` and `{ load, call, id, data }`, and
     `{ load, failed }` when the player or the page's module would not run. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createPlayer } from "{{runtime}}";

      const app = {{app}};
      const url = (path) => new URL(path, document.baseURI).href;
      for (const key of ["wasm", "glue"]) if (app[key]) app[key] = url(app[key]);
      for (const urls of [app.assets, app.data]) for (const key in urls) urls[key] = url(urls[key]);
      for (const name in app.sides) app.sides[name].url = url(app.sides[name].url);

      const named = window.uraedaFrame ?? JSON.parse(decodeURIComponent(location.hash.slice(1)));
      const send = (message) =>
        parent.postMessage(JSON.stringify({ ...message, secret: named.secret }), named.app);
      let load = null;
      let calls = 0;
      const waiting = new Map();
      const fonts = new Map();
      const path = (uri) => uri.replace(/^asset:\/+/, "");
      const loadFont = async (font) => {
        const answer = await fetch(app.assets[font]);
        fonts.set(font, new Uint8Array(await answer.arrayBuffer()));
      };
      const failed = (error) => send({ load, failed: String(error?.message ?? error) });

      // The page's way to the app. Native Shell 0.5.0's browser runtime sends a page's `host.post`
      // and `host.call` to an engine channel nothing answers in a browser, never to the player's
      // `host`: the page's entry takes this one instead (`page_entry`, ruling R466).
      const channel = {
        call: (name, data) =>
          new Promise((resolve, reject) => {
            const id = calls++;
            waiting.set(id, { resolve, reject });
            send({ load, call: name, id, data: data ?? null });
          }),
        post: (name, data) => send({ load, post: name, data: data ?? null }),
      };
      window.uraedaHost = channel;

      let player;
      try {
        [player] = await Promise.all([
          createPlayer(document.getElementById("app"), {
            wasm: fetch(app.wasm),
            glue: app.glue,
            assets: app.assets,
            data: app.data,
            sides: app.sides,
            readAsset: (uri) => fonts.get(path(uri)) ?? null,
            overlay: false,
            host: channel,
          }),
          ...app.fonts.map(loadFont),
        ]);
        // Every part of Native Shell's runtime a page may import, not only those the app's first
        // screen needs.
        const sides = Object.keys(app.sides ?? {}).filter((name) => !app.sides[name].onDemand);
        await player.loadSides(sides, app.sides);
      } catch (error) {
        failed(error);
      }

      addEventListener("message", (event) => {
        if (event.source !== parent || event.origin !== named.app) return;
        if (typeof event.data !== "string") return;
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }
        if (message.run && load === null && player) {
          const { source, capabilities, params } = message.run;
          load = message.run.load;
          const module = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
          player.runModule(module, { capabilities, params }).catch(failed);
        } else if (typeof message.event === "string" && player) {
          player.hostEvent(message.event, message.data ?? null);
        } else if (typeof message.reply === "number") {
          const call = waiting.get(message.reply);
          waiting.delete(message.reply);
          if ("error" in message) {
            const error = new Error(message.error);
            if (message.code) error.code = message.code;
            call?.reject(error);
          } else call?.resolve(message.value);
        }
      });
      if (player) send({ here: true });
    </script>
  </body>
</html>
