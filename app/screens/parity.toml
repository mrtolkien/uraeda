# The screens' parity list, the spec's first success criterion: "Every route of the React UI has a
# screen in the new app, or a line saying why it went". `crates/app/tests/parity.rs` reads it.
#
# `[routes]`: each page of the React UI's route table (`packages/web/src/routeTable.ts`), by its
# name there, with its paths, the page of `app/store/routes.ts` that draws it now and the screen
# that gives that page its place, or `dropped` and why. The test fails on an old page without a
# line, a line of no old page, a page no screen places, and a page mapped to `missing`, which draws
# "Nothing here". That each placed page mounts is `app/screens/shell/places.test.tsx`'s.
#
# TASK 61: the React UI goes. The keys of `[routes]` are then the frozen list of its pages: drop the
# test's read of `routeTable.ts`, and keep this list and its checks.
#
# `[[left]]`: what the old screens did that the screens of tasks 36 to 51 and 65 did not, from their
# commits and rulings, most used first: `brought-back` by task 55 (where it is `now`), `replaced` by
# something the rewrite does otherwise (`now`), or `left`, with what bringing it back `needs` and
# whether a person will miss it (`missed`).

[routes]
home = { path = "/", page = "home", screen = "app/screens/home" }
feature = { path = "/f/<folder>", page = "feature", screen = "app/screens/feature" }
file = { path = "/f/<folder>/<file>", page = "file", screen = "app/screens/file" }
mockup = { path = "/f/<folder>/mockups/<name>", page = "mockup", screen = "app/screens/preview" }
branch-decision = { path = "/f/<folder>/decisions/<name>", page = "branch-decision", screen = "app/screens/decisions" }
session = { path = "/f/<folder>/session", page = "session", screen = "app/screens/session" }
storybook = { path = "/f/<folder>/storybook?story=, /storybook?story=", page = "storybook", screen = "app/screens/preview" }
# An old run's address opens its feature's session: `#turn-<id>` is kept in the address, and the
# conversation opens at that turn (see `[[left]]`).
run = { path = "/f/<folder>/runs/<id>", page = "session", screen = "app/screens/session" }
priorities = { path = "/priorities", page = "priorities", screen = "app/screens/priorities" }
proposal = { path = "/priorities/<key>", page = "proposal", screen = "app/screens/proposal" }
inbox = { path = "/inbox", page = "inbox", screen = "app/screens/inbox" }
note = { path = "/inbox/<key>", page = "note", screen = "app/screens/inbox" }
triage = { path = "/inbox/triage", page = "triage", screen = "app/screens/triage" }
decisions = { path = "/decisions", page = "decisions", screen = "app/screens/decisions" }
decisions-check = { path = "/decisions/check", page = "decisions-check", screen = "app/screens/decisions" }
decision = { path = "/decisions/<name>", page = "decision", screen = "app/screens/decisions" }
constitution = { path = "/decisions/constitution, /decisions/constitution/<slug>", page = "constitution", screen = "app/screens/decisions" }
git = { path = "/git", page = "git", screen = "app/screens/git" }
jobs = { path = "/jobs", page = "jobs", screen = "app/screens/jobs" }
job = { path = "/jobs/<name>, /jobs/~<name>", page = "job", screen = "app/screens/jobs" }
job-new = { path = "/jobs/new", page = "job-new", screen = "app/screens/jobs" }
sessions = { path = "/sessions", page = "sessions", screen = "app/screens/session" }
session-id = { path = "/sessions/<id>", page = "session-id", screen = "app/screens/session" }
new = { path = "/new?kind=session|change|feature", page = "new", screen = "app/screens/new" }
settings = { path = "/settings, /settings/<category>", page = "settings", screen = "app/screens/settings" }
edit = { path = "/edit/<path>", page = "edit", screen = "app/screens/buffer" }
buffer = { path = "/buffer/<path>", page = "buffer", screen = "app/screens/buffer" }
extension = { path = "/e/<name>/<id>…", page = "extension", screen = "app/screens/extension" }
missing = { path = "any other path", page = "missing", screen = "app/screens/shell" }
moved = { path = "/chats/<id>, /chats/new, /changes/new, /commit", dropped = "no page any more: the old addresses parse to the pages they moved to (`app/store/routes.ts`: a session, the New page, the Git page), so no page redirects them (task 24)" }
first-run = { path = "none: the React UI set it when the server listed no repository", dropped = "a state, not an address: the frame draws its first-run pane when the server lists no repository (`app/screens/repository/`, task 36, R251)" }

