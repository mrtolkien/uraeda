packages:
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
minimumReleaseAgeExclude:
  - "@astryxdesign/core@0.6.7"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  # Its postinstall only prints a nudge to run Astryx's setup CLI.
  "@astryxdesign/core": false
