packages:
  - packages/*
catalog:
  "@babel/core": 8.0.7
  "@nkzw/eslint-plugin": 2.0.0
  "@nkzw/oxlint-config": 2.0.1
  # The bundled Vitest's version: Vitest refuses a coverage provider of another.
  "@vitest/coverage-v8": 5.0.1
  "@rolldown/plugin-babel": 0.2.4
  babel-plugin-react-compiler: 1.0.0
  eslint-plugin-no-only-tests: 3.4.0
  eslint-plugin-perfectionist: 5.12.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
minimumReleaseAgeExclude:
  - "@astryxdesign/core@0.6.7"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  # Their postinstalls only print a nudge to run Astryx's setup CLI.
  "@astryxdesign/cli": false
  "@astryxdesign/core": false
